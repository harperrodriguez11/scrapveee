name: Scrape Foodies Profiles

on:
  workflow_dispatch:
    inputs:
      list_url:
        description: 'Main list URL to scrape from (e.g. https://www.foodies.com/foods/ or https://foodies.com/food/)'
        required: true
        default: 'https://www.foodies.com/foods/'
        type: string
      max_profiles:
        description: 'Maximum number of profiles to scrape (e.g. 50)'
        required: true
        default: '50'
        type: string
      start_page:
        description: 'Starting page number'
        required: false
        default: '1'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl beautifulsoup4 lxml
          playwright install chromium --with-deps

      - name: Scrape profiles and generate XLSX
        env:
          LIST_URL: ${{ github.event.inputs.list_url }}
          MAX_PROFILES: ${{ github.event.inputs.max_profiles }}
          START_PAGE: ${{ github.event.inputs.start_page }}
        run: |
          python << 'PYEOF'
          import os
          import time
          import re
          from urllib.parse import urljoin, urlparse, urlunparse, parse_qs, urlencode
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          import pandas as pd

          LIST_URL = os.environ.get("LIST_URL", "https://www.foodies.com/foods/").strip()
          MAX_PROFILES = int(os.environ.get("MAX_PROFILES", "50"))
          START_PAGE = int(os.environ.get("START_PAGE", "1"))

          parsed = urlparse(LIST_URL)
          BASE_URL = f"{parsed.scheme}://{parsed.netloc}"

          def build_page_url(base: str, page_num: int) -> str:
              p = urlparse(base)
              qs = parse_qs(p.query)
              if page_num <= 1:
                  qs.pop("page", None)
              else:
                  qs["page"] = [str(page_num)]
              new_query = urlencode(qs, doseq=True)
              return urlunparse((p.scheme, p.netloc, p.path or "/", p.params, new_query, p.fragment))

          profiles = []
          seen = set()
          page = START_PAGE

          print(f"Starting scrape from: {LIST_URL}")
          print(f"max={MAX_PROFILES}, start_page={START_PAGE}")

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-blink-features=AutomationControlled",
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                  ],
              )
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  viewport={"width": 1280, "height": 900},
                  locale="en-US",
              )
              # Hide webdriver flag
              context.add_init_script("""
                  Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
              """)
              page_obj = context.new_page()

              while len(profiles) < MAX_PROFILES:
                  url = build_page_url(LIST_URL, page)
                  print(f"Fetching page {page}: {url}")

                  try:
                      page_obj.goto(url, wait_until="domcontentloaded", timeout=60000)
                      # Extra wait for any JS-rendered cards
                      page_obj.wait_for_timeout(2500)
                      # Scroll a bit in case of lazy load
                      page_obj.evaluate("window.scrollTo(0, document.body.scrollHeight / 2)")
                      page_obj.wait_for_timeout(1000)
                      page_obj.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                      page_obj.wait_for_timeout(1500)
                  except Exception as e:
                      print(f"Error loading page {page}: {e}")
                      break

                  html = page_obj.content()
                  soup = BeautifulSoup(html, "lxml")

                  # Try multiple common card selectors
                  cards = (
                      soup.select("div.card")
                      or soup.select("article.profile, div.profile-card, .food-card")
                      or soup.select("[class*='card']")
                      or soup.select("[class*='profile']")
                  )

                  # Broader fallback if still empty
                  if not cards:
                      cards = soup.find_all("div", class_=lambda c: c and ("card" in str(c).lower() or "profile" in str(c).lower()))

                  print(f"  Found {len(cards)} potential cards on page {page}")

                  if not cards:
                      # Debug: print a bit of page title / body length
                      title = soup.title.string if soup.title else "(no title)"
                      print(f"  Page title: {title}")
                      print(f"  Body length: {len(html)}")
                      # Check paginator existence
                      paginator = soup.select_one("div.paginator")
                      if not paginator:
                          print("  No cards and no paginator found. Stopping.")
                          break
                      page += 1
                      continue

                  new_on_page = 0
                  for card in cards:
                      if len(profiles) >= MAX_PROFILES:
                          break

                      # --- Image (full absolute URL) ---
                      img = card.select_one("img")
                      image_url = ""
                      if img:
                          src = (
                              img.get("src")
                              or img.get("data-src")
                              or img.get("data-lazy-src")
                              or img.get("data-original")
                              or ""
                          )
                          if src and not src.startswith("data:"):
                              image_url = urljoin(BASE_URL, src)

                      # --- Full name ---
                      full_name = ""
                      name_el = (
                          card.select_one(".card-title")
                          or card.select_one("h1, h2, h3, h4")
                          or card.select_one(".name, .fullname-name, .profile-name, [class*='name']")
                          or card.select_one("a[href*='/']")
                      )
                      if name_el:
                          full_name = name_el.get_text(strip=True)

                      # --- About (exclude .card-title content) ---
                      about = ""
                      about_el = (
                          card.select_one(".about, .bio, .description, .card-body, .profile-about, [class*='about'], [class*='bio']")
                          or card.select_one("p")
                      )
                      if about_el:
                          # Remove any nested card-title
                          for t in about_el.select(".card-title"):
                              t.decompose()
                          about = about_el.get_text(" ", strip=True)
                      else:
                          # Fallback: whole card text minus title
                          clone = BeautifulSoup(str(card), "lxml")
                          for t in clone.select(".card-title"):
                              t.decompose()
                          about = clone.get_text(" ", strip=True)
                          if full_name and about.startswith(full_name):
                              about = about[len(full_name):].strip()

                      # Clean noisy about text a bit
                      about = re.sub(r"\s+", " ", about).strip()

                      key = (image_url, full_name)
                      if not full_name and not image_url:
                          continue
                      if key in seen:
                          continue
                      seen.add(key)

                      profiles.append({
                          "image_url": image_url,
                          "full_name": full_name,
                          "about": about,
                      })
                      new_on_page += 1

                  print(f"  Added {new_on_page} new profiles (total: {len(profiles)})")

                  # Pagination check
                  next_link = soup.select_one(
                      "div.paginator a.next, a.next.pill, a[aria-label='Next page'], a[title='Next page']"
                  )
                  has_next = False
                  if next_link and next_link.get("href"):
                      has_next = True
                  else:
                      # Check highest page number in paginator
                      page_links = soup.select("div.paginator a.pill[href*='page='], a[href*='page=']")
                      if page_links:
                          try:
                              max_p = max(
                                  int(re.search(r"page=(\d+)", a.get("href", "")).group(1))
                                  for a in page_links
                                  if re.search(r"page=(\d+)", a.get("href", ""))
                              )
                              if page < max_p:
                                  has_next = True
                          except Exception:
                              pass

                  if not has_next:
                      print("No more pages. Stopping.")
                      break

                  page += 1
                  time.sleep(1.2)

              browser.close()

          print(f"\nScraped {len(profiles)} profiles total.")

          df = pd.DataFrame(profiles, columns=["image_url", "full_name", "about"])
          df.to_excel("foodies_profiles.xlsx", index=False, engine="openpyxl")
          print("Saved to foodies_profiles.xlsx")
          if not df.empty:
              print(df.head(10).to_string())
          else:
              print("Empty DataFrame – check URL or selectors.")
          PYEOF

      - name: Upload XLSX artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodies-profiles
          path: foodies_profiles.xlsx
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "### Scrape complete" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ github.event.inputs.list_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max profiles**: ${{ github.event.inputs.max_profiles }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Start page**: ${{ github.event.inputs.start_page }}" >> $GITHUB_STEP_SUMMARY
          if [ -f foodies_profiles.xlsx ]; then
            echo "- **Artifact**: foodies_profiles.xlsx uploaded" >> $GITHUB_STEP_SUMMARY
            python -c "import pandas as pd; df=pd.read_excel('foodies_profiles.xlsx'); print(f'- **Rows scraped**: {len(df)}')" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **No file produced**" >> $GITHUB_STEP_SUMMARY
          fi
