name: Scrape Foodies Profiles

on:
  workflow_dispatch:
    inputs:
      list_url:
        description: 'Main list URL to scrape from (e.g. https://www.foodies.com/foods/ or any other page)'
        required: true
        default: 'https://www.foodies.com/foods/'
        type: string
      max_profiles:
        description: 'Maximum number of profiles to scrape (e.g. 50)'
        required: true
        default: '50'
        type: string
      start_page:
        description: 'Starting page number'
        required: false
        default: '1'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas openpyxl lxml

      - name: Scrape profiles and generate XLSX
        env:
          LIST_URL: ${{ github.event.inputs.list_url }}
          MAX_PROFILES: ${{ github.event.inputs.max_profiles }}
          START_PAGE: ${{ github.event.inputs.start_page }}
        run: |
          python << 'PYEOF'
          import os
          import time
          import requests
          from bs4 import BeautifulSoup
          import pandas as pd
          from urllib.parse import urljoin, urlparse, urlunparse, parse_qs, urlencode

          LIST_URL = os.environ.get("LIST_URL", "https://www.foodies.com/foods/").strip()
          if not LIST_URL.endswith("/") and "?" not in LIST_URL:
              LIST_URL = LIST_URL + "/"
          # Derive site origin for absolute image URLs
          parsed = urlparse(LIST_URL)
          BASE_URL = f"{parsed.scheme}://{parsed.netloc}"
          MAX_PROFILES = int(os.environ.get("MAX_PROFILES", "50"))
          START_PAGE = int(os.environ.get("START_PAGE", "1"))

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
          }

          session = requests.Session()
          session.headers.update(headers)

          profiles = []
          page = START_PAGE
          seen = set()

          def build_page_url(base, page_num):
              """Build paginated URL from any starting list URL."""
              if page_num <= 1:
                  # Keep original URL clean for page 1
                  p = urlparse(base)
                  qs = parse_qs(p.query)
                  qs.pop("page", None)
                  new_query = urlencode(qs, doseq=True)
                  return urlunparse((p.scheme, p.netloc, p.path, p.params, new_query, p.fragment))
              p = urlparse(base)
              qs = parse_qs(p.query)
              qs["page"] = [str(page_num)]
              new_query = urlencode(qs, doseq=True)
              return urlunparse((p.scheme, p.netloc, p.path, p.params, new_query, p.fragment))

          print(f"Starting scrape from: {LIST_URL}")
          print(f"max={MAX_PROFILES}, start_page={START_PAGE}")

          while len(profiles) < MAX_PROFILES:
              url = build_page_url(LIST_URL, page)

              print(f"Fetching page {page}: {url}")
              try:
                  resp = session.get(url, timeout=30)
                  resp.raise_for_status()
              except Exception as e:
                  print(f"Error fetching page {page}: {e}")
                  break

              soup = BeautifulSoup(resp.text, "lxml")

              # --- ADJUST SELECTORS TO MATCH ACTUAL SITE STRUCTURE ---
              # Based on provided HTML hints: cards containing card-title, images, about text
              # Common patterns: look for profile cards
              cards = soup.select("div.card, article.profile, div.profile-card, .food-card, [class*='card']")
              if not cards:
                  # Fallback: any element that looks like a profile card
                  cards = soup.find_all("div", class_=lambda c: c and ("card" in c.lower() or "profile" in c.lower()))

              print(f"  Found {len(cards)} potential cards on page {page}")

              if not cards:
                  # Check for next page existence
                  paginator = soup.select_one("div.paginator")
                  if not paginator or not paginator.select_one("a.next, a[href*='page=']"):
                      print("No more cards and no next page. Stopping.")
                      break
                  page += 1
                  time.sleep(1.5)
                  continue

              new_on_page = 0
              for card in cards:
                  if len(profiles) >= MAX_PROFILES:
                      break

                  # Image URL - full absolute path
                  img = card.select_one("img")
                  image_url = ""
                  if img:
                      src = img.get("src") or img.get("data-src") or img.get("data-lazy-src") or ""
                      if src:
                          image_url = urljoin(BASE_URL, src)

                  # Full name - try common places (title, h2/h3, .name, .card-title text)
                  full_name = ""
                  name_el = (
                      card.select_one(".card-title")
                      or card.select_one("h2, h3, h4")
                      or card.select_one(".name, .fullname-name, .profile-name, [class*='name']")
                      or card.select_one("a[href*='/']")
                  )
                  if name_el:
                      full_name = name_el.get_text(strip=True)

                  # About text - user said: trim not include <div class="card-title"></div>
                  # Only the profile about text like "Hello I am chef I give you recipe"
                  about = ""
                  # Prefer a dedicated about / bio / description element
                  about_el = (
                      card.select_one(".about, .bio, .description, .card-body, .profile-about, [class*='about'], [class*='bio']")
                      or card.select_one("p")
                  )
                  if about_el:
                      # Get text, excluding any nested card-title if present
                      for title in about_el.select(".card-title"):
                          title.decompose()
                      about = about_el.get_text(" ", strip=True)
                  else:
                      # Fallback: collect text from card excluding title
                      clone = BeautifulSoup(str(card), "lxml")
                      for t in clone.select(".card-title"):
                          t.decompose()
                      about = clone.get_text(" ", strip=True)
                      # Clean up common noise
                      if full_name and about.startswith(full_name):
                          about = about[len(full_name):].strip()

                  # Skip empty or duplicate
                  key = (image_url, full_name)
                  if not full_name and not image_url:
                      continue
                  if key in seen:
                      continue
                  seen.add(key)

                  profiles.append({
                      "image_url": image_url,
                      "full_name": full_name,
                      "about": about,
                  })
                  new_on_page += 1

              print(f"  Added {new_on_page} new profiles (total: {len(profiles)})")

              # Check if next page exists
              next_link = soup.select_one("div.paginator a.next, a.next.pill, a[aria-label='Next page']")
              if not next_link or "page=" not in (next_link.get("href") or ""):
                  # Also check highest page number
                  page_links = soup.select("div.paginator a.pill[href*='page=']")
                  if page_links:
                      max_p = max(
                          (int(a["href"].split("page=")[-1].split("&")[0]) for a in page_links if "page=" in a.get("href", "")),
                          default=page
                      )
                      if page >= max_p:
                          print("Reached last page.")
                          break
                  else:
                      print("No next page link found. Stopping.")
                      break

              page += 1
              time.sleep(1.5)  # Be polite

          print(f"\nScraped {len(profiles)} profiles total.")

          # Create DataFrame and save XLSX
          df = pd.DataFrame(profiles, columns=["image_url", "full_name", "about"])
          output_path = "foodies_profiles.xlsx"
          df.to_excel(output_path, index=False, engine="openpyxl")
          print(f"Saved to {output_path}")
          print(df.head())
          PYEOF

      - name: Upload XLSX artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodies-profiles
          path: foodies_profiles.xlsx
          retention-days: 30

      - name: Summary
        run: |
          echo "### Scrape complete" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ github.event.inputs.list_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max profiles**: ${{ github.event.inputs.max_profiles }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Start page**: ${{ github.event.inputs.start_page }}" >> $GITHUB_STEP_SUMMARY
          if [ -f foodies_profiles.xlsx ]; then
            echo "- **Artifact**: foodies_profiles.xlsx uploaded" >> $GITHUB_STEP_SUMMARY
          fi
