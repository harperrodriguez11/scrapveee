name: Scrape Foodies Profiles

on:
  workflow_dispatch:
    inputs:
      list_url:
        description: 'Main list URL (full URL)'
        required: true
        default: 'https://foodies.com/food/'
        type: string
      max_profiles:
        description: 'Maximum NEW profiles this run'
        required: true
        default: '50'
        type: string
      start_page:
        description: 'Starting page number'
        required: false
        default: '1'
        type: string
      sheet_name:
        description: 'Excel sheet/tab name (append if exists)'
        required: true
        default: 'Profiles'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest          # change to self-hosted if you use your own runner
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl beautifulsoup4 lxml
          playwright install chromium --with-deps
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/
          rclone version

      - name: Configure rclone (Mega.nz)
        env:
          RCLONE_CONFIG_MEGA: ${{ secrets.RCLONE_CONFIG_MEGA }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -z "$RCLONE_CONFIG_MEGA" ]; then
            echo "ERROR: Secret RCLONE_CONFIG_MEGA is missing"
            exit 1
          fi
          echo "$RCLONE_CONFIG_MEGA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Download previous state from Mega.nz
        run: |
          mkdir -p data
          rclone copy mega:foodies-scrape/image_urls.txt data/ --ignore-errors || true
          rclone copy mega:foodies-scrape/foodies_profiles.xlsx data/ --ignore-errors || true
          [ -f data/image_urls.txt ] || touch data/image_urls.txt
          ls -la data/

      - name: Scrape profiles
        env:
          LIST_URL: ${{ github.event.inputs.list_url }}
          MAX_PROFILES: ${{ github.event.inputs.max_profiles }}
          START_PAGE: ${{ github.event.inputs.start_page }}
          SHEET_NAME: ${{ github.event.inputs.sheet_name }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u << 'PYEOF'
          import os, sys, time, re, socket, shutil
          from urllib.parse import urljoin, urlparse, urlunparse, parse_qs, urlencode
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeout
          from bs4 import BeautifulSoup
          import pandas as pd
          from openpyxl import load_workbook

          def log(msg):
              print(f"[{time.strftime('%H:%M:%S')}] {msg}", flush=True)

          LIST_URL     = os.environ.get("LIST_URL", "").strip()
          MAX_PROFILES = int(os.environ.get("MAX_PROFILES", "50"))
          START_PAGE   = int(os.environ.get("START_PAGE", "1"))
          SHEET_NAME   = (os.environ.get("SHEET_NAME") or "Profiles").strip()
          PROXY_URL    = os.environ.get("PROXY_URL", "").strip() or None

          DATA_DIR         = Path("data")
          IMAGE_URLS_FILE  = DATA_DIR / "image_urls.txt"
          XLSX_FILE       = DATA_DIR / "foodies_profiles.xlsx"
          OUT_XLSX        = Path("foodies_profiles.xlsx")
          MAX_EMPTY_STREAK = 3
          MAX_RETRIES      = 3

          # ---------- URL validation ----------
          log("=" * 60)
          log("URL & NETWORK DIAGNOSTICS")
          log("=" * 60)

          if not LIST_URL.startswith(("http://", "https://")):
              log(f"ERROR: list_url must be a full URL. Got: {LIST_URL!r}")
              raise SystemExit(1)

          parsed = urlparse(LIST_URL)
          if not parsed.netloc:
              log(f"ERROR: no domain in URL: {LIST_URL!r}")
              raise SystemExit(1)

          BASE_URL = f"{parsed.scheme}://{parsed.netloc}"
          log(f" list_url     = {LIST_URL}")
          log(f" BASE_URL     = {BASE_URL}")
          log(f" max_profiles = {MAX_PROFILES}")
          log(f" start_page   = {START_PAGE}")
          log(f" sheet_name   = {SHEET_NAME}")
          log(f" proxy        = {'SET (hidden)' if PROXY_URL else 'NOT SET – using GitHub runner IP'}")

          host = parsed.netloc.split(":")[0]
          try:
              ips = sorted({i[4][0] for i in socket.getaddrinfo(host, None)})
              log(f" DNS OK → {host} → {', '.join(ips)}")
          except socket.gaierror as e:
              log(f" DNS FAILED: {e}")
              raise SystemExit(1)

          def build_page_url(base, page_num):
              p = urlparse(base)
              qs = parse_qs(p.query)
              if page_num <= 1:
                  qs.pop("page", None)
              else:
                  qs["page"] = [str(page_num)]
              return urlunparse((p.scheme, p.netloc, p.path or "/", p.params, urlencode(qs, doseq=True), p.fragment))

          # ---------- known image urls ----------
          known_image_urls = set()
          if IMAGE_URLS_FILE.exists():
              known_image_urls = {l.strip() for l in open(IMAGE_URLS_FILE) if l.strip()}
          log(f" Loaded {len(known_image_urls)} known image URLs")

          profile_urls = []
          seen_ids = set()
          page = START_PAGE
          empty_streak = 0
          results = []

          with sync_playwright() as p:
              launch_args = {
                  "headless": True,
                  "args": [
                      "--disable-blink-features=AutomationControlled",
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                      "--disable-http2",
                      "--ignore-certificate-errors",
                  ],
              }
              if PROXY_URL:
                  # Playwright accepts server=... and optionally username/password
                  # Format: http://user:pass@host:port  or  socks5://...
                  launch_args["proxy"] = {"server": PROXY_URL}
                  log(" Playwright will use the proxy from secret PROXY_URL")

              browser = p.chromium.launch(**launch_args)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                  viewport={"width": 1280, "height": 900},
                  locale="en-US",
                  extra_http_headers={
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
                      "Accept-Language": "en-US,en;q=0.9",
                      "Upgrade-Insecure-Requests": "1",
                  },
              )
              context.add_init_script("""
                  Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
                  Object.defineProperty(navigator, 'plugins', {get: () => [1,2,3,4,5]});
                  window.chrome = { runtime: {} };
              """)
              page_obj = context.new_page()

              page_obj.on("requestfailed", lambda req: log(f" [req failed] {req.url[:90]} → {req.failure}"))

              # ========== PHASE 1 ==========
              log("=" * 60)
              log("PHASE 1: Collect profile URLs")
              log("=" * 60)

              while len(profile_urls) < MAX_PROFILES:
                  url = build_page_url(LIST_URL, page)
                  log("-" * 50)
                  log(f"LIST PAGE {page} → {url}")
                  log(f" collected: {len(profile_urls)} / {MAX_PROFILES}")

                  success = False
                  last_err = None

                  for attempt in range(1, MAX_RETRIES + 1):
                      try:
                          log(f" → goto attempt {attempt}/{MAX_RETRIES}")
                          t0 = time.time()
                          resp = page_obj.goto(url, wait_until="domcontentloaded", timeout=60000)
                          status = resp.status if resp else "N/A"
                          log(f" → done in {time.time()-t0:.1f}s | status={status}")

                          if resp and resp.status >= 400:
                              log(f" ✗ HTTP {resp.status}")
                              if resp.status in (403, 429, 503):
                                  log("   → likely IP block / rate-limit / bot protection")
                              last_err = f"HTTP {resp.status}"
                              if attempt < MAX_RETRIES:
                                  time.sleep(3 * attempt)
                                  continue
                              break

                          page_obj.wait_for_timeout(2000)
                          page_obj.evaluate("window.scrollTo(0, document.body.scrollHeight/2)")
                          page_obj.wait_for_timeout(800)
                          page_obj.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                          page_obj.wait_for_timeout(1200)

                          html = page_obj.content()
                          log(f" → HTML length: {len(html)}")
                          success = True
                          break

                      except Exception as e:
                          last_err = f"{type(e).__name__}: {e}"
                          log(f" ✗ attempt {attempt}: {last_err}")
                          err = str(e).lower()
                          if "http2" in err:
                              log("   → HTTP/2 error (proxy or CDN issue)")
                          elif "connection" in err or "timeout" in err:
                              log("   → connection/timeout – proxy may be bad or site blocking")
                          if attempt < MAX_RETRIES:
                              time.sleep(2 * attempt)

                  if not success:
                      log(f" All retries failed. Last error: {last_err}")
                      empty_streak += 1
                      if empty_streak >= MAX_EMPTY_STREAK:
                          log(f"{MAX_EMPTY_STREAK} consecutive failures → stop")
                          log("Most likely: GitHub IP (or proxy IP) is blocked by the site")
                          break
                      page += 1
                      continue

                  soup = BeautifulSoup(html, "lxml")
                  title = (soup.title.string or "").strip() if soup.title else ""
                  log(f" title: {title[:80]}")

                  links = (soup.select("div.grid_item a[href*='/profile/']")
                           or soup.select("a[href*='/profile/?id=']")
                           or soup.select("a[data-slug]")
                           or soup.select("a[href*='profile']"))
                  log(f" found {len(links)} candidate links")

                  if not links:
                      body = (soup.body.get_text(" ", strip=True)[:300] if soup.body else "")
                      log(f" body preview: {body!r}")
                      lower = body.lower()
                      if any(x in lower for x in ["cloudflare", "attention required", "just a moment", "access denied", "blocked", "captcha"]):
                          log(" !!! Bot-protection / Cloudflare / CAPTCHA page detected")
                      empty_streak += 1
                      if empty_streak >= MAX_EMPTY_STREAK:
                          break
                      page += 1
                      continue

                  new = 0
                  for a in links:
                      if len(profile_urls) >= MAX_PROFILES:
                          break
                      href = a.get("href") or ""
                      if not href:
                          continue
                      full = urljoin(BASE_URL, href)
                      m = re.search(r"[?&]id=([^&]+)", full) or re.search(r"/profile/([^/?]+)", full)
                      pid = m.group(1) if m else full
                      if pid in seen_ids:
                          continue
                      seen_ids.add(pid)
                      profile_urls.append(full)
                      new += 1
                      if new <= 5 or new % 10 == 0:
                          log(f" + [{len(profile_urls)}] {full}")

                  log(f" Added {new} new → total {len(profile_urls)}")
                  empty_streak = 0 if new else empty_streak + 1
                  if empty_streak >= MAX_EMPTY_STREAK:
                      log("No new data for several pages → stop")
                      break

                  next_link = soup.select_one("div.paginator a.next, a.next.pill, a[aria-label='Next page']")
                  has_next = bool(next_link and next_link.get("href"))
                  if not has_next:
                      log("No next page link → end of list")
                      break
                  page += 1
                  time.sleep(1)

              log(f"PHASE 1 DONE → {len(profile_urls)} URLs")

              # ========== PHASE 2 ==========
              if profile_urls:
                  log("PHASE 2: scrape individual profiles")
                  skipped = 0
                  for i, purl in enumerate(profile_urls, 1):
                      log(f"PROFILE {i}/{len(profile_urls)} → {purl}")
                      try:
                          resp = page_obj.goto(purl, wait_until="domcontentloaded", timeout=45000)
                          page_obj.wait_for_timeout(1800)
                          page_obj.evaluate("window.scrollTo(0, 400)")
                          page_obj.wait_for_timeout(600)
                          html = page_obj.content()
                      except Exception as e:
                          log(f" ✗ {e}")
                          results.append({"image_url":"", "full_name":"", "about":f"ERROR: {e}", "profile_url":purl})
                          continue

                      soup = BeautifulSoup(html, "lxml")
                      title = (soup.title.string or "").strip() if soup.title else ""

                      full_name = ""
                      for sel in ["h1", "h1.name", ".profile-name", ".full-name", ".card-title", "[class*='name']", "h2"]:
                          el = soup.select_one(sel)
                          if el:
                              t = el.get_text(strip=True)
                              if t and len(t) < 120:
                                  full_name = t
                                  break
                      if not full_name and title:
                          full_name = title.split("|")[0].split("-")[0].strip()

                      about = ""
                      for sel in [".about", ".bio", ".description", "[class*='about']", "[class*='bio']", "p"]:
                          for el in soup.select(sel):
                              t = re.sub(r"\s+", " ", el.get_text(" ", strip=True)).strip()
                              if 20 < len(t) < 2000:
                                  about = t
                                  break
                          if about:
                              break

                      image_url = ""
                      for sel in ["img.profile-image", "img.avatar", "img[class*='profile']", "img[class*='avatar']",
                                  "meta[property='og:image']", "meta[name='twitter:image']", "img"]:
                          if sel.startswith("meta"):
                              el = soup.select_one(sel)
                              if el and el.get("content"):
                                  image_url = urljoin(BASE_URL, el["content"])
                                  break
                          else:
                              for img in soup.select(sel):
                                  src = img.get("src") or img.get("data-src") or img.get("data-lazy-src") or ""
                                  if src and not src.startswith("data:") and "icon" not in src.lower() and "logo" not in src.lower():
                                      image_url = urljoin(BASE_URL, src)
                                      break
                          if image_url:
                              break

                      if image_url and image_url in known_image_urls:
                          log(f" ⏭ skip duplicate image")
                          skipped += 1
                          continue

                      results.append({
                          "image_url": image_url,
                          "full_name": full_name,
                          "about": about,
                          "profile_url": purl,
                      })
                      if image_url:
                          known_image_urls.add(image_url)
                      log(f" ✓ {full_name[:40]!r} | img={bool(image_url)}")
                      time.sleep(0.7)

                  log(f"PHASE 2 DONE → {len(results)} new, {skipped} skipped")

              browser.close()

          # ---------- save state ----------
          DATA_DIR.mkdir(parents=True, exist_ok=True)
          with open(IMAGE_URLS_FILE, "w", encoding="utf-8") as f:
              for u in sorted(known_image_urls):
                  f.write(u + "\n")
          log(f"Wrote {len(known_image_urls)} image URLs")

          new_df = pd.DataFrame(results, columns=["image_url", "full_name", "about", "profile_url"])
          log(f"New rows: {len(new_df)}")

          if XLSX_FILE.exists():
              try:
                  book = load_workbook(XLSX_FILE)
                  if SHEET_NAME in book.sheetnames:
                      existing = pd.read_excel(XLSX_FILE, sheet_name=SHEET_NAME)
                      combined = pd.concat([existing, new_df], ignore_index=True)
                      combined = combined.drop_duplicates(subset=["image_url", "profile_url"], keep="first")
                  else:
                      combined = new_df
                  with pd.ExcelWriter(XLSX_FILE, engine="openpyxl", mode="a", if_sheet_exists="replace") as writer:
                      if SHEET_NAME in writer.book.sheetnames:
                          idx = writer.book.sheetnames.index(SHEET_NAME)
                          writer.book.remove(writer.book.worksheets[idx])
                      combined.to_excel(writer, sheet_name=SHEET_NAME, index=False)
                  log(f"Sheet '{SHEET_NAME}' now has {len(combined)} rows")
              except Exception as e:
                  log(f"Excel error: {e} → fresh file")
                  new_df.to_excel(XLSX_FILE, sheet_name=SHEET_NAME, index=False)
          else:
              new_df.to_excel(XLSX_FILE, sheet_name=SHEET_NAME, index=False)

          shutil.copy(XLSX_FILE, OUT_XLSX)
          log(f"Saved {OUT_XLSX}")
          log(f"SCRAPE FINISHED → {len(results)} new profiles")
          PYEOF

      - name: Upload to Mega.nz
        run: |
          rclone mkdir mega:foodies-scrape || true
          rclone copy data/image_urls.txt mega:foodies-scrape/ --progress
          rclone copy data/foodies_profiles.xlsx mega:foodies-scrape/ --progress
          rclone ls mega:foodies-scrape/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodies-profiles
          path: |
            foodies_profiles.xlsx
            data/image_urls.txt
          retention-days: 30

      - name: Summary
        run: |
          echo "### Scrape finished" >> $GITHUB_STEP_SUMMARY
          echo "- URL: ${{ github.event.inputs.list_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- Sheet: ${{ github.event.inputs.sheet_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Proxy used: ${{ secrets.PROXY_URL != '' && 'yes' || 'no' }}" >> $GITHUB_STEP_SUMMARY
