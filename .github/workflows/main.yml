      - name: Scrape profiles (parallel) and generate / append XLSX
        if: steps.lock.outputs.acquired == 'true'
        env:
          LIST_URL: ${{ github.event.inputs.list_url }}
          SCRAPE_ALL_PER_PAGE: ${{ github.event.inputs.scrape_all_per_page }}
          MAX_PROFILES: ${{ github.event.inputs.max_profiles }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
          START_PAGE: ${{ github.event.inputs.start_page }}
          SHEET_NAME: ${{ github.event.inputs.sheet_name }}
          PAGE_WAIT_MS: ${{ github.event.inputs.page_wait_ms }}
          PROFILE_WAIT_MS: ${{ github.event.inputs.profile_wait_ms }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u << 'PYEOF'
          import os, sys, time, re, socket, threading, shutil
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urljoin, urlparse, urlunparse, parse_qs, urlencode
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeout
          from bs4 import BeautifulSoup
          import pandas as pd
          from openpyxl import load_workbook

          print_lock = threading.Lock()
          def log(msg):
              with print_lock:
                  print(f"[{time.strftime('%H:%M:%S')}] {msg}", flush=True)

          LIST_URL = os.environ.get("LIST_URL", "").strip()
          SCRAPE_ALL_PER_PAGE = os.environ.get("SCRAPE_ALL_PER_PAGE", "false").strip().lower() == "true"
          MAX_PROFILES = int(os.environ.get("MAX_PROFILES", "50") or "50")
          CONCURRENCY = max(1, int(os.environ.get("CONCURRENCY", "5") or "5"))
          START_PAGE = int(os.environ.get("START_PAGE", "1") or "1")
          SHEET_NAME = (os.environ.get("SHEET_NAME", "Profiles") or "Profiles").strip()
          PAGE_WAIT_MS = int(os.environ.get("PAGE_WAIT_MS", "900") or "900")
          PROFILE_WAIT_MS = int(os.environ.get("PROFILE_WAIT_MS", "600") or "600")

          DATA_DIR = Path("data")
          IMAGE_URLS_FILE = DATA_DIR / "image_urls.txt"
          XLSX_FILE = DATA_DIR / "foodies_profiles.xlsx"
          OUT_XLSX = Path("foodies_profiles.xlsx")
          DEBUG_HTML_FILE = DATA_DIR / "debug_first_profile.html"
          COLUMNS = ["image_url", "full_name", "about"]

          MAX_EMPTY_STREAK = 3
          MAX_RETRIES_PER_PAGE = 3
          CHECKPOINT_EVERY = 25

          BROWSER_ARGS = [
              "--disable-blink-features=AutomationControlled",
              "--no-sandbox",
              "--disable-dev-shm-usage",
              "--disable-http2",
              "--disable-features=IsolateOrigins,site-per-process",
              "--ignore-certificate-errors",
              "--disable-web-security",
          ]
          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          )
          EXTRA_HEADERS = {
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "gzip, deflate, br",
              "Upgrade-Insecure-Requests": "1",
              "Sec-Fetch-Dest": "document",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "none",
              "Sec-Fetch-User": "?1",
          }
          STEALTH_SCRIPT = """
              Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
              Object.defineProperty(navigator, 'plugins', {get: () => [1, 2, 3, 4, 5]});
              Object.defineProperty(navigator, 'languages', {get: () => ['en-US', 'en']});
              window.chrome = { runtime: {} };
          """

          def new_stealth_page(p):
              browser = p.chromium.launch(headless=True, args=BROWSER_ARGS)
              context = browser.new_context(
                  user_agent=USER_AGENT,
                  viewport={"width": 1280, "height": 900},
                  locale="en-US",
                  extra_http_headers=EXTRA_HEADERS,
              )
              context.add_init_script(STEALTH_SCRIPT)
              return browser, context, context.new_page()

          log("=" * 60)
          log("URL & NETWORK DIAGNOSTICS")
          log("=" * 60)
          if not LIST_URL or not LIST_URL.startswith(("http://", "https://")):
              log("ERROR: list_url invalid")
              raise SystemExit(1)
          parsed = urlparse(LIST_URL)
          if not parsed.netloc:
              log("ERROR: list_url has no domain")
              raise SystemExit(1)
          BASE_URL = f"{parsed.scheme}://{parsed.netloc}"
          log(f" list_url = {LIST_URL}")
          log(f" BASE_URL = {BASE_URL}")
          log(f" scrape_all_per_page = {SCRAPE_ALL_PER_PAGE}")
          log(f" max_profiles = {MAX_PROFILES}")
          log(f" concurrency = {CONCURRENCY}")
          log(f" start_page = {START_PAGE}")
          log(f" sheet_name = {SHEET_NAME}")

          host = parsed.netloc.split(":")[0]
          try:
              ips = sorted({item[4][0] for item in socket.getaddrinfo(host, None)})
              log(f" DNS OK -> {host} -> {', '.join(ips)}")
          except socket.gaierror as e:
              log(f" DNS FAILED: {e}")
              raise SystemExit(1)

          def build_page_url(base, page_num):
              p = urlparse(base)
              qs = parse_qs(p.query)
              if page_num <= 1:
                  qs.pop("page", None)
              else:
                  qs["page"] = [str(page_num)]
              return urlunparse((p.scheme, p.netloc, p.path or "/", p.params, urlencode(qs, doseq=True), p.fragment))

          known_image_urls = set()
          if IMAGE_URLS_FILE.exists():
              with open(IMAGE_URLS_FILE, encoding="utf-8") as f:
                  for line in f:
                      u = line.strip()
                      if u:
                          known_image_urls.add(u)
          log(f" Loaded {len(known_image_urls)} known image URLs")

          known_urls_lock = threading.Lock()
          save_lock = threading.Lock()

          if XLSX_FILE.exists():
              try:
                  book = load_workbook(XLSX_FILE, read_only=True)
                  if SHEET_NAME in book.sheetnames:
                      existing_df = pd.read_excel(XLSX_FILE, sheet_name=SHEET_NAME, engine="openpyxl")
                  else:
                      existing_df = pd.DataFrame(columns=COLUMNS)
                  book.close()
                  if "profile_url" in existing_df.columns:
                      existing_df = existing_df.drop(columns=["profile_url"])
                  existing_df = existing_df.reindex(columns=COLUMNS)
              except Exception as e:
                  log(f" Could not read existing xlsx ({e}) - starting fresh")
                  existing_df = pd.DataFrame(columns=COLUMNS)
          else:
              existing_df = pd.DataFrame(columns=COLUMNS)

          accumulated_new = []

          def save_checkpoint(results_batch, reason=""):
              with save_lock:
                  DATA_DIR.mkdir(parents=True, exist_ok=True)
                  with open(IMAGE_URLS_FILE, "w", encoding="utf-8") as f:
                      for u in sorted(known_image_urls):
                          f.write(u + "\n")
                  accumulated_new.extend(results_batch)
                  new_df = pd.DataFrame(accumulated_new, columns=COLUMNS)
                  combined = pd.concat([existing_df, new_df], ignore_index=True)
                  combined = combined.drop_duplicates(subset=["image_url"], keep="first")
                  try:
                      combined.to_excel(XLSX_FILE, sheet_name=SHEET_NAME, index=False, engine="openpyxl")
                      shutil.copy(XLSX_FILE, OUT_XLSX)
                  except Exception as e:
                      log(f" Checkpoint write error: {e}")
                  log(f" CHECKPOINT ({reason}) -> +{len(results_batch)} rows, total {len(combined)}")

          profile_urls = []
          seen_ids = set()
          page = START_PAGE
          empty_pages_streak = 0

          def cap_reached():
              return (not SCRAPE_ALL_PER_PAGE) and len(profile_urls) >= MAX_PROFILES

          log("=" * 60)
          log("PHASE 1: list pages -> collect profile URLs")
          log("=" * 60)

          with sync_playwright() as p:
              browser, context, page_obj = new_stealth_page(p)
              log("Chromium ready")

              while not cap_reached():
                  url = build_page_url(LIST_URL, page)
                  log("-" * 50)
                  log(f"LIST PAGE {page} -> {url}")
                  log(f" collected so far: {len(profile_urls)}" + ("" if SCRAPE_ALL_PER_PAGE else f" / {MAX_PROFILES}"))

                  success = False
                  last_error = None
                  for attempt in range(1, MAX_RETRIES_PER_PAGE + 1):
                      try:
                          log(f" -> goto attempt {attempt}/{MAX_RETRIES_PER_PAGE}")
                          t0 = time.time()
                          resp = page_obj.goto(url, wait_until="domcontentloaded", timeout=60000)
                          log(f" -> done in {time.time()-t0:.1f}s | status={resp.status if resp else 'N/A'}")
                          if resp and resp.status >= 400:
                              last_error = f"HTTP {resp.status}"
                              if attempt < MAX_RETRIES_PER_PAGE:
                                  time.sleep(3 * attempt)
                                  continue
                              break
                          page_obj.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                          page_obj.wait_for_timeout(PAGE_WAIT_MS)
                          html = page_obj.content()
                          log(f" -> HTML length: {len(html)}")
                          success = True
                          break
                      except PlaywrightTimeout as e:
                          last_error = f"Timeout: {e}"
                          log(f" X attempt {attempt} TIMEOUT")
                      except Exception as e:
                          last_error = f"{type(e).__name__}: {e}"
                          log(f" X attempt {attempt} failed: {last_error}")
                      if attempt < MAX_RETRIES_PER_PAGE:
                          time.sleep(2 * attempt)

                  if not success:
                      log(f" All attempts failed for page {page}: {last_error}")
                      empty_pages_streak += 1
                      if empty_pages_streak >= MAX_EMPTY_STREAK:
                          break
                      page += 1
                      continue

                  soup = BeautifulSoup(html, "lxml")
                  title = (soup.title.string or "(no title)").strip() if soup.title else "(no title)"
                  log(f" Page title: {title}")

                  links = soup.select("div.grid_item a[href*='/profile/']")
                  log(f" selector grid_item -> {len(links)}")
                  if not links:
                      links = soup.select("a[href*='/profile/?id=']")
                      log(f" fallback /profile/?id= -> {len(links)}")
                  if not links:
                      links = soup.select("a[data-slug]")
                      log(f" fallback data-slug -> {len(links)}")
                  if not links:
                      links = soup.select("a[href*='profile']")
                      log(f" fallback profile -> {len(links)}")

                  if not links:
                      empty_pages_streak += 1
                      if empty_pages_streak >= MAX_EMPTY_STREAK:
                          break
                      page += 1
                      continue

                  new = 0
                  for a in links:
                      if cap_reached():
                          break
                      href = a.get("href") or ""
                      if not href:
                          continue
                      full = urljoin(BASE_URL, href)
                      m = re.search(r"[?&]id=([^&]+)", full) or re.search(r"/profile/([^/?]+)", full)
                      pid = m.group(1) if m else full
                      if pid in seen_ids:
                          continue
                      seen_ids.add(pid)
                      profile_urls.append(full)
                      new += 1
                      if new <= 5 or new % 10 == 0:
                          log(f" + profile URL [{len(profile_urls)}]: {full}")

                  log(f" Added {new} -> total unique: {len(profile_urls)}")
                  if new == 0:
                      empty_pages_streak += 1
                      if empty_pages_streak >= MAX_EMPTY_STREAK:
                          break
                  else:
                      empty_pages_streak = 0

                  next_link = soup.select_one(
                      "div.paginator a.next, a.next.pill, a[aria-label='Next page'], a[title='Next page']"
                  )
                  has_next = bool(next_link and next_link.get("href"))
                  if not has_next:
                      page_links = soup.select("div.paginator a[href*='page='], a.pill[href*='page=']")
                      if page_links:
                          try:
                              nums = [int(re.search(r"page=(\d+)", a.get("href", "")).group(1))
                                      for a in page_links if re.search(r"page=(\d+)", a.get("href", ""))]
                              if nums and page < max(nums):
                                  has_next = True
                          except Exception:
                              pass
                  if not has_next:
                      log(" No more list pages")
                      break
                  page += 1
                  time.sleep(0.3)

              log("=" * 60)
              log(f"PHASE 1 DONE -> {len(profile_urls)} profile URLs collected")
              log("=" * 60)
              browser.close()

          extraction_stats = {"name": 0, "about": 0, "image": 0, "total": 0}
          stats_lock = threading.Lock()
          debug_html_saved = threading.Event()
          GENERIC_TITLES = {"enjoy your favorite chef profile"}

          def extract_profile(soup, html):
              image_url = ""
              full_name = ""
              img_el = soup.select_one("div.card-image img")
              if img_el:
                  src = img_el.get("src") or img_el.get("data-src") or img_el.get("data-lazy-src") or ""
                  if src and not src.startswith("data:"):
                      image_url = urljoin(BASE_URL, src)
                  alt = (img_el.get("alt") or "").strip()
                  if alt:
                      full_name = alt
              if not full_name:
                  m = re.search(
                      r"\.card-title\s*:{1,2}\s*before\s*\{[^}]*content\s*:\s*[\"']([^\"']+)[\"']",
                      html, re.I,
                  )
                  if m:
                      raw = m.group(1).strip()
                      name_m = re.match(r"^(.+?)'s\b", raw)
                      full_name = name_m.group(1).strip() if name_m else raw
              if not full_name and soup.title:
                  t = (soup.title.string or "").strip()
                  if t and t.lower() not in GENERIC_TITLES:
                      full_name = t.split("|")[0].split("-")[0].strip()
              if not image_url:
                  m_img = re.search(r'https?://img\.foodies\.com/[^\s"\'<>]+', html)
                  if m_img:
                      image_url = m_img.group(0)
              about = ""
              desc_p = soup.select_one("div.desc p")
              if desc_p:
                  about = desc_p.get_text(" ", strip=True)
              else:
                  desc_container = soup.select_one("div.desc")
                  if desc_container:
                      about = desc_container.get_text(" ", strip=True)
              about = re.sub(r"^About:\s*", "", about, flags=re.I).strip()
              if not about:
                  for subtitle in soup.find_all(string=re.compile(r"^\s*About:?\s*$", re.I)):
                      parent = subtitle.parent
                      candidate = parent.find_next("p") if parent else None
                      if candidate:
                          about = candidate.get_text(" ", strip=True)
                          break
              if not about:
                  text = soup.get_text(" ", strip=True)
                  m2 = re.search(r"About:\s*(.{1,400}?)(?:\s{2,}|$)", text)
                  if m2:
                      about = m2.group(1).strip()
              return full_name, about, image_url

          def worker_scrape(chunk, worker_id):
              local_results = []
              local_dups = 0
              if not chunk:
                  return local_results, local_dups
              with sync_playwright() as p:
                  browser, context, page_obj = new_stealth_page(p)
                  log(f"[W{worker_id}] browser ready - {len(chunk)} profiles")
                  since_last_checkpoint = 0
                  for i, purl in enumerate(chunk, 1):
                      log(f"[W{worker_id}] {i}/{len(chunk)} -> OPEN {purl}")
                      html = ""
                      load_error = None
                      for load_attempt in range(1, 3):
                          try:
                              t0 = time.time()
                              resp = page_obj.goto(purl, wait_until="domcontentloaded", timeout=45000)
                              log(f"[W{worker_id}] goto {load_attempt} done in {time.time()-t0:.1f}s | status={resp.status if resp else 'N/A'}")
                              try:
                                  page_obj.wait_for_load_state("networkidle", timeout=12000)
                              except PlaywrightTimeout:
                                  pass
                              page_obj.evaluate("window.scrollTo(0, 400)")
                              img_ready = desc_ready = True
                              try:
                                  page_obj.wait_for_selector("div.card-image img[src]", timeout=15000)
                              except PlaywrightTimeout:
                                  img_ready = False
                                  log(f"[W{worker_id}] card-image not ready")
                              try:
                                  page_obj.wait_for_selector("div.desc p, div.desc", timeout=10000)
                              except PlaywrightTimeout:
                                  desc_ready = False
                                  log(f"[W{worker_id}] desc not ready")
                              if not (img_ready and desc_ready) and load_attempt == 1:
                                  log(f"[W{worker_id}] reload once")
                                  continue
                              page_obj.wait_for_timeout(PROFILE_WAIT_MS)
                              html = page_obj.content()
                              load_error = None
                              break
                          except Exception as e:
                              load_error = e
                              log(f"[W{worker_id}] X load {load_attempt}: {type(e).__name__}: {e}")
                              if load_attempt < 2:
                                  time.sleep(2)
                      if load_error is not None or not html:
                          log(f"[W{worker_id}] X ERROR after retries: {load_error}")
                          local_results.append({"image_url": "", "full_name": "", "about": f"ERROR: {load_error}"})
                          continue
                      if not debug_html_saved.is_set():
                          try:
                              DATA_DIR.mkdir(parents=True, exist_ok=True)
                              with open(DEBUG_HTML_FILE, "w", encoding="utf-8") as f:
                                  f.write(html)
                              debug_html_saved.set()
                          except Exception:
                              pass
                      soup = BeautifulSoup(html, "lxml")
                      full_name, about, image_url = extract_profile(soup, html)
                      with stats_lock:
                          extraction_stats["total"] += 1
                          if full_name: extraction_stats["name"] += 1
                          if about: extraction_stats["about"] += 1
                          if image_url: extraction_stats["image"] += 1
                      if image_url:
                          with known_urls_lock:
                              if image_url in known_image_urls:
                                  local_dups += 1
                                  continue
                              known_image_urls.add(image_url)
                      local_results.append({
                          "image_url": image_url,
                          "full_name": full_name,
                          "about": about,
                      })
                      since_last_checkpoint += 1
                      log(f"[W{worker_id}] OK name={full_name[:40]!r} | img={bool(image_url)} | about_len={len(about)}")
                      if since_last_checkpoint >= CHECKPOINT_EVERY:
                          save_checkpoint(local_results[-since_last_checkpoint:], reason=f"W{worker_id} +{since_last_checkpoint}")
                          since_last_checkpoint = 0
                  if since_last_checkpoint > 0:
                      save_checkpoint(local_results[-since_last_checkpoint:], reason=f"W{worker_id} final")
                  browser.close()
              return local_results, local_dups

          def chunk_list(lst, n):
              if n <= 0:
                  return [lst]
              k, m = divmod(len(lst), n)
              return [lst[i*k + min(i, m):(i+1)*k + min(i+1, m)] for i in range(n)]

          results = []
          if not profile_urls:
              log("No profile URLs found")
          else:
              workers_needed = min(CONCURRENCY, len(profile_urls))
              log("=" * 60)
              log(f"PHASE 2: open each profile page ({workers_needed} workers)")
              log("=" * 60)
              chunks = chunk_list(profile_urls, workers_needed)
              total_dups = 0
              try:
                  with ThreadPoolExecutor(max_workers=workers_needed) as executor:
                      futures = {executor.submit(worker_scrape, chunk, idx+1): idx
                                 for idx, chunk in enumerate(chunks)}
                      for fut in as_completed(futures):
                          chunk_results, chunk_dups = fut.result()
                          results.extend(chunk_results)
                          total_dups += chunk_dups
              except Exception as e:
                  log(f" Phase 2 crashed: {type(e).__name__}: {e}")
              log(f"PHASE 2 DONE -> {len(results)} new, {total_dups} dups skipped")
              if extraction_stats["total"]:
                  log(f" hit-rate name={extraction_stats['name']}/{extraction_stats['total']} "
                      f"about={extraction_stats['about']}/{extraction_stats['total']} "
                      f"image={extraction_stats['image']}/{extraction_stats['total']}")

          DATA_DIR.mkdir(parents=True, exist_ok=True)
          with open(IMAGE_URLS_FILE, "w", encoding="utf-8") as f:
              for u in sorted(known_image_urls):
                  f.write(u + "\n")
          log(f"Wrote {len(known_image_urls)} image URLs")

          if accumulated_new:
              final_df = pd.concat([existing_df, pd.DataFrame(accumulated_new, columns=COLUMNS)], ignore_index=True)
              final_df = final_df.drop_duplicates(subset=["image_url"], keep="first")
              final_df.to_excel(XLSX_FILE, sheet_name=SHEET_NAME, index=False, engine="openpyxl")
              shutil.copy(XLSX_FILE, OUT_XLSX)
              log(f"Final -> sheet '{SHEET_NAME}' has {len(final_df)} rows")
          elif XLSX_FILE.exists():
              shutil.copy(XLSX_FILE, OUT_XLSX)
              log(f"No new rows -> sheet stays at {len(existing_df)} rows")
          else:
              log("No xlsx created")

          log("=" * 60)
          log(f"SCRAPE FINISHED -> {len(results)} new profiles")
          log("=" * 60)
          PYEOF
