name: Scrape Foodies Profiles

on:
  workflow_dispatch:
    inputs:
      list_url:
        description: 'Main list URL (full URL)'
        required: true
        default: 'https://www.foodies.com/female/'
        type: string
      max_profiles:
        description: 'Maximum NEW profiles this run'
        required: true
        default: '500'
        type: string
      start_page:
        description: 'Starting page number'
        required: false
        default: '1'
        type: string
      sheet_name:
        description: 'Excel sheet/tab name (append if exists)'
        required: true
        default: 'Profiles'
        type: string
      parallel:
        description: 'How many profiles to scrape in parallel (1-8 recommended)'
        required: true
        default: '5'
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # 6 hours for large runs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl beautifulsoup4 lxml
          playwright install chromium --with-deps
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o rclone.zip
          unzip -q rclone.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/
          rclone version

      - name: Configure rclone (Mega.nz)
        env:
          RCLONE_CONFIG_MEGA: ${{ secrets.RCLONE_CONFIG_MEGA }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -z "$RCLONE_CONFIG_MEGA" ]; then
            echo "ERROR: Secret RCLONE_CONFIG_MEGA is empty"
            exit 1
          fi
          echo "$RCLONE_CONFIG_MEGA" > ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Download previous state from Mega.nz
        run: |
          mkdir -p data
          rclone copy mega:foodies-scrape/image_urls.txt data/ --ignore-errors || true
          rclone copy mega:foodies-scrape/foodies_profiles.xlsx data/ --ignore-errors || true
          [ -f data/image_urls.txt ] || touch data/image_urls.txt
          ls -la data/

      - name: Scrape profiles
        env:
          LIST_URL: ${{ github.event.inputs.list_url }}
          MAX_PROFILES: ${{ github.event.inputs.max_profiles }}
          START_PAGE: ${{ github.event.inputs.start_page }}
          SHEET_NAME: ${{ github.event.inputs.sheet_name }}
          PARALLEL: ${{ github.event.inputs.parallel }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u << 'PYEOF'
          import os, sys, time, re, socket, shutil
          from urllib.parse import urljoin, urlparse, urlunparse, parse_qs, urlencode
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup
          import pandas as pd
          from openpyxl import load_workbook

          def log(msg):
              print(f"[{time.strftime('%H:%M:%S')}] {msg}", flush=True)

          LIST_URL     = os.environ.get("LIST_URL", "").strip()
          MAX_PROFILES = int(os.environ.get("MAX_PROFILES", "500"))
          START_PAGE   = int(os.environ.get("START_PAGE", "1"))
          SHEET_NAME   = (os.environ.get("SHEET_NAME") or "Profiles").strip()
          PARALLEL     = max(1, min(8, int(os.environ.get("PARALLEL", "5"))))

          DATA_DIR        = Path("data")
          IMAGE_URLS_FILE = DATA_DIR / "image_urls.txt"
          XLSX_FILE      = DATA_DIR / "foodies_profiles.xlsx"
          OUT_XLSX       = Path("foodies_profiles.xlsx")
          MAX_EMPTY_STREAK = 3
          MAX_RETRIES      = 3

          # ---------- validation ----------
          log("=" * 60)
          log("CONFIG")
          log("=" * 60)
          if not LIST_URL.startswith(("http://", "https://")):
              log(f"ERROR: bad LIST_URL {LIST_URL!r}")
              raise SystemExit(1)
          parsed = urlparse(LIST_URL)
          if not parsed.netloc:
              log(f"ERROR: no domain in {LIST_URL!r}")
              raise SystemExit(1)
          BASE_URL = f"{parsed.scheme}://{parsed.netloc}"
          log(f" list_url     = {LIST_URL}")
          log(f" BASE_URL     = {BASE_URL}")
          log(f" max_profiles = {MAX_PROFILES}")
          log(f" start_page   = {START_PAGE}")
          log(f" sheet_name   = {SHEET_NAME}")
          log(f" parallel     = {PARALLEL}")

          host = parsed.netloc.split(":")[0]
          try:
              ips = sorted({i[4][0] for i in socket.getaddrinfo(host, None)})
              log(f" DNS OK → {host} → {', '.join(ips)}")
          except Exception as e:
              log(f" DNS FAILED: {e}")
              raise SystemExit(1)

          def build_page_url(base, page_num):
              p = urlparse(base)
              qs = parse_qs(p.query)
              if page_num <= 1:
                  qs.pop("page", None)
              else:
                  qs["page"] = [str(page_num)]
              return urlunparse((p.scheme, p.netloc, p.path or "/", p.params,
                                 urlencode(qs, doseq=True), p.fragment))

          # ---------- known images ----------
          known_image_urls = set()
          if IMAGE_URLS_FILE.exists():
              known_image_urls = {l.strip() for l in open(IMAGE_URLS_FILE) if l.strip()}
          log(f" Loaded {len(known_image_urls)} known image URLs")

          results = []          # final rows (only new ones)
          seen_ids = set()
          page = START_PAGE
          empty_streak = 0
          total_new = 0

          # ================================================================
          # Helper: scrape one profile (runs inside a worker)
          # ================================================================
          def scrape_one_profile(context, purl):
              """Return dict or None if duplicate/skip."""
              page_obj = context.new_page()
              try:
                  resp = page_obj.goto(purl, wait_until="domcontentloaded", timeout=30000)
                  page_obj.wait_for_timeout(800)
                  html = page_obj.content()
              except Exception as e:
                  page_obj.close()
                  return {
                      "image_url": "",
                      "full_name": "",
                      "about": f"ERROR: {e}",
                      "profile_url": purl,
                  }

              soup = BeautifulSoup(html, "lxml")
              title = (soup.title.string or "").strip() if soup.title else ""

              # ---- name (avoid generic titles) ----
              full_name = ""
              generic = {"enjoy your favorite model profile", "foodies", "best female foodies profiles"}
              for sel in [
                  "h1.profile-name", "h1.name", ".profile-name", ".full-name",
                  ".user-name", ".card-title", "h1", "h2",
              ]:
                  el = soup.select_one(sel)
                  if el:
                      t = el.get_text(strip=True)
                      if t and len(t) < 120 and t.lower() not in generic:
                          full_name = t
                          break
              if not full_name and title:
                  cand = title.split("|")[0].split("-")[0].strip()
                  if cand.lower() not in generic:
                      full_name = cand

              # ---- about ----
              about = ""
              for sel in [
                  ".about", ".bio", ".description", ".profile-about", ".profile-bio",
                  "[class*='about']", "[class*='bio']", ".card-body p", "section p", "p",
              ]:
                  for el in soup.select(sel):
                      t = re.sub(r"\s+", " ", el.get_text(" ", strip=True)).strip()
                      if 20 < len(t) < 2000:
                          about = t
                          break
                  if about:
                      break

              # ---- image ----
              image_url = ""
              for sel in [
                  "img.profile-image", "img.avatar", "img[class*='profile']",
                  "img[class*='avatar']", "img[class*='photo']",
                  "meta[property='og:image']", "meta[name='twitter:image']", "img",
              ]:
                  if sel.startswith("meta"):
                      el = soup.select_one(sel)
                      if el and el.get("content"):
                          image_url = urljoin(BASE_URL, el["content"])
                          break
                  else:
                      for img in soup.select(sel):
                          src = (img.get("src") or img.get("data-src")
                                 or img.get("data-lazy-src") or img.get("data-original") or "")
                          if (src and not src.startswith("data:")
                                  and "icon" not in src.lower()
                                  and "logo" not in src.lower()):
                              image_url = urljoin(BASE_URL, src)
                              break
                  if image_url:
                      break

              page_obj.close()

              if image_url and image_url in known_image_urls:
                  return None          # duplicate → skip

              return {
                  "image_url": image_url,
                  "full_name": full_name,
                  "about": about,
                  "profile_url": purl,
              }

          # ================================================================
          # MAIN
          # ================================================================
          with sync_playwright() as p:
              log("Launching Chromium ...")
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-blink-features=AutomationControlled",
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                      "--disable-http2",
                      "--ignore-certificate-errors",
                  ],
              )

              # One context for list pages
              list_context = browser.new_context(
                  user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 (KHTML, like Gecko) "
                              "Chrome/122.0.0.0 Safari/537.36"),
                  viewport={"width": 1280, "height": 900},
                  locale="en-US",
              )
              list_context.add_init_script(
                  "Object.defineProperty(navigator,'webdriver',{get:()=>undefined});"
              )
              list_page = list_context.new_page()

              # Pool of contexts for parallel profile scraping
              worker_contexts = []
              for _ in range(PARALLEL):
                  ctx = browser.new_context(
                      user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                                  "Chrome/122.0.0.0 Safari/537.36"),
                      viewport={"width": 1280, "height": 900},
                      locale="en-US",
                  )
                  ctx.add_init_script(
                      "Object.defineProperty(navigator,'webdriver',{get:()=>undefined});"
                  )
                  worker_contexts.append(ctx)

              log(f" Browser ready | parallel workers = {PARALLEL}")

              # ---------- PHASE 1+2 combined: per list page ----------
              while total_new < MAX_PROFILES:
                  url = build_page_url(LIST_URL, page)
                  log("-" * 50)
                  log(f"LIST PAGE {page} → {url}")
                  log(f" new so far: {total_new} / {MAX_PROFILES}")

                  success = False
                  html = ""
                  for attempt in range(1, MAX_RETRIES + 1):
                      try:
                          log(f" → goto attempt {attempt}/{MAX_RETRIES}")
                          t0 = time.time()
                          resp = list_page.goto(url, wait_until="domcontentloaded", timeout=45000)
                          status = resp.status if resp else "N/A"
                          log(f" → done in {time.time()-t0:.1f}s | status={status}")
                          if resp and resp.status >= 400:
                              if attempt < MAX_RETRIES:
                                  time.sleep(2 * attempt)
                                  continue
                              break
                          list_page.wait_for_timeout(1000)
                          list_page.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                          list_page.wait_for_timeout(800)
                          html = list_page.content()
                          log(f" → HTML length: {len(html)}")
                          success = True
                          break
                      except Exception as e:
                          log(f" ✗ attempt {attempt}: {type(e).__name__}: {e}")
                          if attempt < MAX_RETRIES:
                              time.sleep(2 * attempt)

                  if not success:
                      empty_streak += 1
                      if empty_streak >= MAX_EMPTY_STREAK:
                          log(f"{MAX_EMPTY_STREAK} consecutive failures → stop")
                          break
                      page += 1
                      continue

                  soup = BeautifulSoup(html, "lxml")
                  title = (soup.title.string or "").strip() if soup.title else ""
                  log(f" title: {title[:70]}")

                  links = (soup.select("div.grid_item a[href*='/profile/']")
                           or soup.select("a[href*='/profile/?id=']")
                           or soup.select("a[href*='profile']"))
                  log(f" found {len(links)} candidate links")

                  if not links:
                      empty_streak += 1
                      if empty_streak >= MAX_EMPTY_STREAK:
                          log("No links for several pages → stop")
                          break
                      page += 1
                      continue

                  # Collect unique profile URLs for this page
                  page_urls = []
                  for a in links:
                      if total_new + len(page_urls) >= MAX_PROFILES:
                          break
                      href = a.get("href") or ""
                      if not href:
                          continue
                      full = urljoin(BASE_URL, href)
                      m = re.search(r"[?&]id=([^&]+)", full) or re.search(r"/profile/([^/?]+)", full)
                      pid = m.group(1) if m else full
                      if pid in seen_ids:
                          continue
                      seen_ids.add(pid)
                      page_urls.append(full)

                  log(f" unique new URLs on this page: {len(page_urls)}")

                  if not page_urls:
                      empty_streak += 1
                      if empty_streak >= MAX_EMPTY_STREAK:
                          break
                      page += 1
                      continue

                  empty_streak = 0

                  # ---------- scrape this page's profiles in parallel ----------
                  log(f" Scraping {len(page_urls)} profiles with {PARALLEL} workers ...")
                  batch_results = []

                  def worker(args):
                      ctx, purl = args
                      return scrape_one_profile(ctx, purl)

                  tasks = []
                  with ThreadPoolExecutor(max_workers=PARALLEL) as executor:
                      # round-robin assign contexts
                      for i, purl in enumerate(page_urls):
                          ctx = worker_contexts[i % PARALLEL]
                          tasks.append(executor.submit(worker, (ctx, purl)))

                      for fut in as_completed(tasks):
                          row = fut.result()
                          if row is None:
                              continue          # duplicate image
                          batch_results.append(row)
                          if row.get("image_url"):
                              known_image_urls.add(row["image_url"])

                  results.extend(batch_results)
                  total_new += len(batch_results)
                  log(f" ✓ page {page} done → +{len(batch_results)} new | total new = {total_new}")

                  # next page?
                  next_link = soup.select_one(
                      "div.paginator a.next, a.next.pill, a[aria-label='Next page'], a[title='Next page']"
                  )
                  has_next = bool(next_link and next_link.get("href"))
                  if not has_next:
                      page_links = soup.select("div.paginator a[href*='page='], a.pill[href*='page=']")
                      if page_links:
                          try:
                              nums = [int(re.search(r"page=(\d+)", a.get("href", "")).group(1))
                                      for a in page_links if re.search(r"page=(\d+)", a.get("href", ""))]
                              if page < max(nums or [page]):
                                  has_next = True
                          except Exception:
                              pass
                  if not has_next:
                      log("No more list pages.")
                      break
                  if total_new >= MAX_PROFILES:
                      log("Reached max_profiles.")
                      break
                  page += 1
                  time.sleep(0.5)

              log("Closing browser ...")
              browser.close()

          # ================================================================
          # SINGLE write of image_urls.txt + xlsx  (only once)
          # ================================================================
          log("=" * 60)
          log("SAVING RESULTS (once)")
          log("=" * 60)

          DATA_DIR.mkdir(parents=True, exist_ok=True)
          with open(IMAGE_URLS_FILE, "w", encoding="utf-8") as f:
              for u in sorted(known_image_urls):
                  f.write(u + "\n")
          log(f"Wrote {len(known_image_urls)} image URLs")

          new_df = pd.DataFrame(results, columns=["image_url", "full_name", "about", "profile_url"])
          log(f"New rows this run: {len(new_df)}")

          if XLSX_FILE.exists():
              try:
                  book = load_workbook(XLSX_FILE)
                  if SHEET_NAME in book.sheetnames:
                      existing = pd.read_excel(XLSX_FILE, sheet_name=SHEET_NAME, engine="openpyxl")
                      combined = pd.concat([existing, new_df], ignore_index=True)
                      combined = combined.drop_duplicates(subset=["image_url", "profile_url"], keep="first")
                      log(f"Appending to existing sheet '{SHEET_NAME}'")
                  else:
                      combined = new_df
                      log(f"Creating new sheet '{SHEET_NAME}'")

                  with pd.ExcelWriter(XLSX_FILE, engine="openpyxl", mode="a", if_sheet_exists="replace") as writer:
                      if SHEET_NAME in writer.book.sheetnames:
                          idx = writer.book.sheetnames.index(SHEET_NAME)
                          writer.book.remove(writer.book.worksheets[idx])
                      combined.to_excel(writer, sheet_name=SHEET_NAME, index=False)
                  log(f"Sheet '{SHEET_NAME}' now has {len(combined)} rows")
              except Exception as e:
                  log(f"Excel error: {e} → fresh file")
                  new_df.to_excel(XLSX_FILE, sheet_name=SHEET_NAME, index=False, engine="openpyxl")
          else:
              new_df.to_excel(XLSX_FILE, sheet_name=SHEET_NAME, index=False, engine="openpyxl")
              log(f"Created new xlsx with sheet '{SHEET_NAME}'")

          shutil.copy(XLSX_FILE, OUT_XLSX)
          log(f"Saved {OUT_XLSX}")

          if not new_df.empty:
              log("First 5 new rows:")
              print(new_df.head(5).to_string(), flush=True)
          else:
              log("No new rows.")

          log("=" * 60)
          log(f"SCRAPE FINISHED → {len(results)} new profiles")
          log("=" * 60)
          PYEOF

      - name: Upload to Mega.nz (once)
        run: |
          echo "=== Uploading to mega:foodies-scrape/ (once) ==="
          rclone mkdir mega:foodies-scrape || true
          rclone copy data/image_urls.txt mega:foodies-scrape/ --progress
          rclone copy data/foodies_profiles.xlsx mega:foodies-scrape/ --progress
          echo "=== Upload done ==="
          rclone ls mega:foodies-scrape/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: foodies-profiles
          path: |
            foodies_profiles.xlsx
            data/image_urls.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Summary
        run: |
          echo "### Scrape complete" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ github.event.inputs.list_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Max new**: ${{ github.event.inputs.max_profiles }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Parallel**: ${{ github.event.inputs.parallel }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Sheet**: ${{ github.event.inputs.sheet_name }}" >> $GITHUB_STEP_SUMMARY
          if [ -f foodies_profiles.xlsx ]; then
            python -c "
          import pandas as pd
          from openpyxl import load_workbook
          wb = load_workbook('foodies_profiles.xlsx')
          print(f'- **Sheets**: {wb.sheetnames}')
          sheet = '${{ github.event.inputs.sheet_name }}'
          if sheet in wb.sheetnames:
              df = pd.read_excel('foodies_profiles.xlsx', sheet_name=sheet)
              print(f'- **Rows in \"{sheet}\":** {len(df)}')
          " >> $GITHUB_STEP_SUMMARY
          fi
