name: Scrape Foodies Profiles (Multi-IP Race)
on:
  workflow_dispatch:
    inputs:
      num_jobs:
        description: 'How many parallel jobs to launch to find a runner IP that can reach the site (e.g. 5 or 7)'
        required: true
        default: '5'
        type: choice
        options:
          - '3'
          - '5'
          - '7'
          - '10'
      list_url:
        description: 'Main list URL (must be full URL, e.g. https://www.example.com/masterchef/)'
        required: true
        default: 'https://foodies.com/food/'
        type: string
      scrape_all_per_page:
        description: 'Scrape ALL profiles found on each page (ignores max_profiles cap)'
        required: true
        default: false
        type: boolean
      max_profiles:
        description: 'Maximum number of NEW profiles to scrape this run (ignored if scrape_all_per_page = true)'
        required: true
        default: '50'
        type: string
      concurrency:
        description: 'How many profiles to scrape in parallel at once (Phase 2, within the winning job)'
        required: true
        default: '5'
        type: string
      start_page:
        description: 'Starting page number'
        required: false
        default: '1'
        type: string
      sheet_name:
        description: 'Excel sheet/tab name (if exists → append, else create new)'
        required: true
        default: 'Profiles'
        type: string
      page_wait_ms:
        description: 'Milliseconds to wait after a list page loads before scrolling/parsing'
        required: false
        default: '900'
        type: string
      profile_wait_ms:
        description: 'Milliseconds to wait after a profile page loads before scraping it'
        required: false
        default: '600'
        type: string

jobs:
  # ------------------------------------------------------------------
  # Build the matrix [1, 2, ... N] from the num_jobs input so you can
  # pick 5 or 7 (or 3/10) at trigger time without editing the workflow.
  # ------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          N="${{ github.event.inputs.num_jobs }}"
          MATRIX=$(python3 -c "import json; print(json.dumps(list(range(1, int('$N') + 1))))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Launching $N parallel instances: $MATRIX"

  scrape:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          echo "=== [Instance ${{ matrix.instance }}] Installing Python packages ==="
          python -m pip install --upgrade pip
          pip install playwright pandas openpyxl beautifulsoup4 lxml
          echo "=== Installing Chromium for Playwright ==="
          playwright install chromium --with-deps
          echo "=== Installing rclone ==="
          curl -O https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone-current-linux-amd64.zip
          sudo cp rclone-*-linux-amd64/rclone /usr/local/bin/
          rclone version
          echo "=== Dependencies ready ==="

      - name: Configure rclone (Mega.nz) from single secret
        env:
          RCLONE_CONFIG_MEGA: ${{ secrets.RCLONE_CONFIG_MEGA }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -z "$RCLONE_CONFIG_MEGA" ]; then
            echo "ERROR: Secret RCLONE_CONFIG_MEGA is empty. Add it in repo Settings → Secrets."
            exit 1
          fi
          echo "$RCLONE_CONFIG_MEGA" > ~/.config/rclone/rclone.conf
          echo "rclone.conf written"
          rclone listremotes

      # ------------------------------------------------------------------
      # STEP 1: quick, cheap reachability probe from THIS runner's IP.
      # No retries loop, no Phase 1/2 — just "can I even load the list page".
      # ------------------------------------------------------------------
      - name: Probe site accessibility
        id: probe
        env:
          LIST_URL: ${{ github.event.inputs.list_url }}
        run: |
          python3 -u << 'PYEOF'
          import os, sys, time
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          LIST_URL = os.environ["LIST_URL"].strip()
          accessible = False
          reason = ""

          BROWSER_ARGS = [
              "--disable-blink-features=AutomationControlled",
              "--no-sandbox",
              "--disable-dev-shm-usage",
              "--disable-http2",
              "--ignore-certificate-errors",
              "--disable-web-security",
          ]
          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          )
          EXTRA_HEADERS = {
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }
          STEALTH_SCRIPT = """
              Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
              Object.defineProperty(navigator, 'plugins', {get: () => [1, 2, 3, 4, 5]});
              Object.defineProperty(navigator, 'languages', {get: () => ['en-US', 'en']});
              window.chrome = { runtime: {} };
          """

          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True, args=BROWSER_ARGS)
                  context = browser.new_context(
                      user_agent=USER_AGENT,
                      viewport={"width": 1280, "height": 900},
                      locale="en-US",
                      extra_http_headers=EXTRA_HEADERS,
                  )
                  context.add_init_script(STEALTH_SCRIPT)
                  page = context.new_page()
                  resp = page.goto(LIST_URL, wait_until="domcontentloaded", timeout=25000)
                  status = resp.status if resp else None
                  html = page.content()
                  browser.close()

              lower = html.lower()
              blocked_kw = ["cloudflare", "attention required", "just a moment", "access denied", "captcha"]
              if status and status >= 400:
                  reason = f"HTTP {status}"
              elif any(k in lower for k in blocked_kw):
                  reason = "bot-protection / block page detected"
              elif len(html) < 500:
                  reason = f"suspiciously short response ({len(html)} bytes)"
              else:
                  accessible = True
                  reason = f"OK (HTTP {status}, {len(html)} bytes)"
          except PWTimeout:
              reason = "timeout"
          except Exception as e:
              reason = f"{type(e).__name__}: {e}"

          print(f"[Instance ${{ matrix.instance }}] Probe result: accessible={accessible} ({reason})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"accessible={'true' if accessible else 'false'}\n")
              f.write(f"reason={reason}\n")
          PYEOF

      # ------------------------------------------------------------------
      # STEP 2: only instances that CAN reach the site race for a lock
      # stored on Mega.nz. First one to write it wins and does the scrape;
      # everyone else backs off immediately. A stale lock (>25 min old,
      # e.g. left behind by a crashed run) is treated as free.
      # ------------------------------------------------------------------
      - name: Attempt to claim scrape lock (first accessible instance wins)
        id: lock
        if: steps.probe.outputs.accessible == 'true'
        run: |
          mkdir -p lock
          LOCK_ID="run${{ github.run_id }}-inst${{ matrix.instance }}-$(date +%s)"
          echo "$LOCK_ID" > lock/mine.txt

          rclone cat mega:foodies-scrape/.run-lock.txt > lock/current.txt 2>/dev/null || echo "" > lock/current.txt
          CURRENT=$(cat lock/current.txt)
          NOW=$(date +%s)
          STALE=false

          if [ -n "$CURRENT" ]; then
            LOCK_TS=$(echo "$CURRENT" | grep -oE '[0-9]+$' || echo 0)
            AGE=$((NOW - LOCK_TS))
            echo "Existing lock: $CURRENT (age ${AGE}s)"
            if [ "$AGE" -gt 1500 ]; then
              echo "Lock is stale (>25min) — treating as free"
              STALE=true
            fi
          else
            echo "No existing lock — free"
            STALE=true
          fi

          if [ -z "$CURRENT" ] || [ "$STALE" == "true" ]; then
            rclone copyto lock/mine.txt mega:foodies-scrape/.run-lock.txt
            sleep 3
            rclone cat mega:foodies-scrape/.run-lock.txt > lock/verify.txt
            WINNER=$(cat lock/verify.txt)
            if [ "$WINNER" == "$LOCK_ID" ]; then
              echo "✅ Instance ${{ matrix.instance }}: lock acquired ($LOCK_ID) — this instance will scrape"
              echo "acquired=true" >> "$GITHUB_OUTPUT"
              echo "$LOCK_ID" > lock/my_lock_id.txt
            else
              echo "❌ Instance ${{ matrix.instance }}: lost the race — lock held by $WINNER"
              echo "acquired=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "❌ Instance ${{ matrix.instance }}: lock already held by $CURRENT — backing off"
            echo "acquired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download previous state from Mega.nz
        if: steps.lock.outputs.acquired == 'true'
        run: |
          mkdir -p data
          rclone copy mega:foodies-scrape/image_urls.txt data/ --ignore-errors || true
          rclone copy mega:foodies-scrape/foodies_profiles.xlsx data/ --ignore-errors || true
          ls -la data/ || true
          if [ -f data/image_urls.txt ]; then
            echo "Loaded $(wc -l < data/image_urls.txt) known image URLs"
          else
            echo "No previous image_urls.txt – starting fresh"
            touch data/image_urls.txt
          fi
          if [ -f data/foodies_profiles.xlsx ]; then
            echo "Loaded existing foodies_profiles.xlsx"
          else
            echo "No previous xlsx – will create new"
          fi

      - name: Scrape profiles (parallel) and generate / append XLSX
        if: steps.lock.outputs.acquired == 'true'
        env:
          LIST_URL: ${{ github.event.inputs.list_url }}
          SCRAPE_ALL_PER_PAGE: ${{ github.event.inputs.scrape_all_per_page }}
          MAX_PROFILES: ${{ github.event.inputs.max_profiles }}
          CONCURRENCY: ${{ github.event.inputs.concurrency }}
          START_PAGE: ${{ github.event.inputs.start_page }}
          SHEET_NAME: ${{ github.event.inputs.sheet_name }}
          PAGE_WAIT_MS: ${{ github.event.inputs.page_wait_ms }}
          PROFILE_WAIT_MS: ${{ github.event.inputs.profile_wait_ms }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u << 'PYEOF'
          import os
          import sys
          import time
          import re
          import socket
          import threading
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.parse import urljoin, urlparse, urlunparse, parse_qs, urlencode
          from pathlib import Path
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeout
          from bs4 import BeautifulSoup
          import pandas as pd
          from openpyxl import load_workbook
          import shutil

          print_lock = threading.Lock()

          def log(msg):
              ts = time.strftime("%H:%M:%S")
              with print_lock:
                  print(f"[{ts}] {msg}", flush=True)
                  sys.stdout.flush()

          # ------------------------------------------------------------------
          # Config
          # ------------------------------------------------------------------
          LIST_URL = os.environ.get("LIST_URL", "").strip()
          SCRAPE_ALL_PER_PAGE = os.environ.get("SCRAPE_ALL_PER_PAGE", "false").strip().lower() == "true"
          MAX_PROFILES = int(os.environ.get("MAX_PROFILES", "50") or "50")
          CONCURRENCY = max(1, int(os.environ.get("CONCURRENCY", "5") or "5"))
          START_PAGE = int(os.environ.get("START_PAGE", "1") or "1")
          SHEET_NAME = (os.environ.get("SHEET_NAME", "Profiles") or "Profiles").strip()
          PAGE_WAIT_MS = int(os.environ.get("PAGE_WAIT_MS", "900") or "900")
          PROFILE_WAIT_MS = int(os.environ.get("PROFILE_WAIT_MS", "600") or "600")
          DATA_DIR = Path("data")
          IMAGE_URLS_FILE = DATA_DIR / "image_urls.txt"
          XLSX_FILE = DATA_DIR / "foodies_profiles.xlsx"
          OUT_XLSX = Path("foodies_profiles.xlsx")
          DEBUG_HTML_FILE = DATA_DIR / "debug_first_profile.html"
          MAX_EMPTY_STREAK = 3
          MAX_RETRIES_PER_PAGE = 3
          CHECKPOINT_EVERY = 25

          BROWSER_ARGS = [
              "--disable-blink-features=AutomationControlled",
              "--no-sandbox",
              "--disable-dev-shm-usage",
              "--disable-http2",
              "--disable-features=IsolateOrigins,site-per-process",
              "--ignore-certificate-errors",
              "--disable-web-security",
          ]
          USER_AGENT = (
              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
              "AppleWebKit/537.36 (KHTML, like Gecko) "
              "Chrome/122.0.0.0 Safari/537.36"
          )
          EXTRA_HEADERS = {
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "gzip, deflate, br",
              "Upgrade-Insecure-Requests": "1",
              "Sec-Fetch-Dest": "document",
              "Sec-Fetch-Mode": "navigate",
              "Sec-Fetch-Site": "none",
              "Sec-Fetch-User": "?1",
          }
          STEALTH_SCRIPT = """
              Object.defineProperty(navigator, 'webdriver', {get: () => undefined});
              Object.defineProperty(navigator, 'plugins', {get: () => [1, 2, 3, 4, 5]});
              Object.defineProperty(navigator, 'languages', {get: () => ['en-US', 'en']});
              window.chrome = { runtime: {} };
          """

          def new_stealth_page(p):
              browser = p.chromium.launch(headless=True, args=BROWSER_ARGS)
              context = browser.new_context(
                  user_agent=USER_AGENT,
                  viewport={"width": 1280, "height": 900},
                  locale="en-US",
                  extra_http_headers=EXTRA_HEADERS,
              )
              context.add_init_script(STEALTH_SCRIPT)
              page_obj = context.new_page()
              return browser, context, page_obj

          # ------------------------------------------------------------------
          # URL validation + diagnostics
          # ------------------------------------------------------------------
          log("=" * 60)
          log("URL & NETWORK DIAGNOSTICS")
          log("=" * 60)
          if not LIST_URL:
              log("ERROR: list_url is empty")
              raise SystemExit(1)
          if not LIST_URL.startswith(("http://", "https://")):
              log(f"ERROR: list_url must start with http:// or https://")
              log(f" Got: {LIST_URL!r}")
              raise SystemExit(1)
          parsed = urlparse(LIST_URL)
          if not parsed.netloc:
              log(f"ERROR: list_url has no domain (netloc is empty)")
              log(f" Got: {LIST_URL!r}")
              log(" Example of a valid URL: https://www.example.com/masterchef/")
              raise SystemExit(1)
          BASE_URL = f"{parsed.scheme}://{parsed.netloc}"
          log(f" list_url = {LIST_URL}")
          log(f" BASE_URL = {BASE_URL}")
          log(f" scrape_all_per_page = {SCRAPE_ALL_PER_PAGE}")
          log(f" max_profiles = {MAX_PROFILES} (new ones this run, ignored if scrape_all_per_page=True)")
          log(f" concurrency = {CONCURRENCY} (parallel workers for Phase 2)")
          log(f" start_page = {START_PAGE}")
          log(f" sheet_name = {SHEET_NAME}")
          log(f" page_wait_ms = {PAGE_WAIT_MS} | profile_wait_ms = {PROFILE_WAIT_MS}")
          host = parsed.netloc.split(":")[0]
          try:
              ips = socket.getaddrinfo(host, None)
              unique_ips = sorted({item[4][0] for item in ips})
              log(f" DNS OK → {host} resolves to: {', '.join(unique_ips)}")
          except socket.gaierror as e:
              log(f" DNS FAILED for host '{host}': {e}")
              raise SystemExit(1)
          port = 443 if parsed.scheme == "https" else 80
          try:
              sock = socket.create_connection((host, port), timeout=10)
              sock.close()
              log(f" TCP connect to {host}:{port} → OK")
          except Exception as e:
              log(f" TCP connect to {host}:{port} FAILED: {type(e).__name__}: {e}")

          def build_page_url(base: str, page_num: int) -> str:
              p = urlparse(base)
              qs = parse_qs(p.query)
              if page_num <= 1:
                  qs.pop("page", None)
              else:
                  qs["page"] = [str(page_num)]
              new_query = urlencode(qs, doseq=True)
              return urlunparse((p.scheme, p.netloc, p.path or "/", p.params, new_query, p.fragment))

          known_image_urls = set()
          if IMAGE_URLS_FILE.exists():
              with open(IMAGE_URLS_FILE, "r", encoding="utf-8") as f:
                  for line in f:
                      u = line.strip()
                      if u:
                          known_image_urls.add(u)
          log(f" Loaded {len(known_image_urls)} known image URLs (will skip matches)")
          known_urls_lock = threading.Lock()

          save_lock = threading.Lock()

          if XLSX_FILE.exists():
              try:
                  book = load_workbook(XLSX_FILE, read_only=True)
                  if SHEET_NAME in book.sheetnames:
                      existing_df = pd.read_excel(XLSX_FILE, sheet_name=SHEET_NAME, engine="openpyxl")
                  else:
                      existing_df = pd.DataFrame(columns=["image_url", "full_name", "about", "profile_url"])
                  book.close()
              except Exception as e:
                  log(f" ✗ Could not read existing xlsx ({e}) — starting this sheet fresh")
                  existing_df = pd.DataFrame(columns=["image_url", "full_name", "about", "profile_url"])
          else:
              existing_df = pd.DataFrame(columns=["image_url", "full_name", "about", "profile_url"])
          accumulated_new = []

          def save_checkpoint(results_batch, reason=""):
              with save_lock:
                  DATA_DIR.mkdir(parents=True, exist_ok=True)
                  with open(IMAGE_URLS_FILE, "w", encoding="utf-8") as f:
                      for u in sorted(known_image_urls):
                          f.write(u + "\n")
                  accumulated_new.extend(results_batch)
                  new_df = pd.DataFrame(accumulated_new, columns=["image_url", "full_name", "about", "profile_url"])
                  combined = pd.concat([existing_df, new_df], ignore_index=True)
                  combined = combined.drop_duplicates(subset=["profile_url"], keep="first")
                  try:
                      combined.to_excel(XLSX_FILE, sheet_name=SHEET_NAME, index=False, engine="openpyxl")
                      shutil.copy(XLSX_FILE, OUT_XLSX)
                  except Exception as e:
                      log(f" ✗ Checkpoint excel write error: {e}")
                  log(f" 💾 CHECKPOINT SAVED ({reason}) → {len(results_batch)} rows this batch, "
                      f"{len(combined)} total rows, {len(known_image_urls)} known image URLs on disk")

          profile_urls = []
          seen_ids = set()
          page = START_PAGE
          empty_pages_streak = 0

          def cap_reached():
              return (not SCRAPE_ALL_PER_PAGE) and len(profile_urls) >= MAX_PROFILES

          log("=" * 60)
          log("PHASE 1: Collect profile URLs from list pages")
          log("=" * 60)
          with sync_playwright() as p:
              log("Launching Playwright + Chromium (HTTP/2 disabled + stealth) ...")
              browser, context, page_obj = new_stealth_page(p)
              log(" Chromium launched, browser context + page ready")
              page_obj.on("console", lambda msg: log(f" [browser] {msg.type}: {msg.text}"))
              page_obj.on("pageerror", lambda err: log(f" [page error] {err}"))
              page_obj.on("requestfailed", lambda req: log(
                  f" [req failed] {req.url[:100]} → {req.failure}"
              ))
              while not cap_reached():
                  url = build_page_url(LIST_URL, page)
                  log("-" * 50)
                  log(f"LIST PAGE {page} → {url}")
                  log(f" collected so far: {len(profile_urls)}" + ("" if SCRAPE_ALL_PER_PAGE else f" / {MAX_PROFILES}"))
                  success = False
                  last_error = None
                  for attempt in range(1, MAX_RETRIES_PER_PAGE + 1):
                      try:
                          log(f" → goto() attempt {attempt}/{MAX_RETRIES_PER_PAGE} ...")
                          t0 = time.time()
                          resp = page_obj.goto(url, wait_until="domcontentloaded", timeout=60000)
                          elapsed = time.time() - t0
                          status = resp.status if resp else "N/A"
                          log(f" → goto done in {elapsed:.1f}s | HTTP status = {status}")
                          if resp and resp.status >= 400:
                              log(f" ✗ HTTP error status {resp.status}")
                              if resp.status in (403, 429, 503):
                                  log(" → Possible IP block / rate-limit / bot protection")
                              last_error = f"HTTP {resp.status}"
                              if attempt < MAX_RETRIES_PER_PAGE:
                                  time.sleep(3 * attempt)
                                  continue
                              break
                          page_obj.evaluate("window.scrollTo(0, document.body.scrollHeight)")
                          page_obj.wait_for_timeout(PAGE_WAIT_MS)
                          html = page_obj.content()
                          log(f" → HTML length: {len(html)}")
                          success = True
                          break
                      except PlaywrightTimeout as e:
                          last_error = f"Timeout: {e}"
                          log(f" ✗ attempt {attempt} TIMEOUT: {e}")
                      except Exception as e:
                          last_error = f"{type(e).__name__}: {e}"
                          log(f" ✗ attempt {attempt} failed: {last_error}")
                      if attempt < MAX_RETRIES_PER_PAGE:
                          wait = 2 * attempt
                          log(f" waiting {wait}s before retry ...")
                          time.sleep(wait)
                  if not success:
                      log(f" All {MAX_RETRIES_PER_PAGE} attempts failed for page {page}")
                      log(f" Last error: {last_error}")
                      empty_pages_streak += 1
                      if empty_pages_streak >= MAX_EMPTY_STREAK:
                          log(f" {MAX_EMPTY_STREAK} consecutive failures → stop Phase 1")
                          break
                      page += 1
                      continue
                  soup = BeautifulSoup(html, "lxml")
                  title = (soup.title.string or "(no title)").strip() if soup.title else "(no title)"
                  log(f" Page title: {title}")
                  links = soup.select("div.grid_item a[href*='/profile/']")
                  log(f" selector 'div.grid_item a[href*=\"/profile/\"]' → {len(links)}")
                  if not links:
                      links = soup.select("a[href*='/profile/?id=']")
                      log(f" fallback 'a[href*=\"/profile/?id=\"]' → {len(links)}")
                  if not links:
                      links = soup.select("a[data-slug]")
                      log(f" fallback 'a[data-slug]' → {len(links)}")
                  if not links:
                      links = soup.select("a[href*='profile']")
                      log(f" fallback 'a[href*=\"profile\"]' → {len(links)}")
                  if not links:
                      empty_pages_streak += 1
                      if empty_pages_streak >= MAX_EMPTY_STREAK:
                          log(f" No usable links for {MAX_EMPTY_STREAK} pages → stop Phase 1")
                          break
                      page += 1
                      continue
                  new = 0
                  hit_cap_mid_page = False
                  for a in links:
                      if cap_reached():
                          hit_cap_mid_page = True
                          break
                      href = a.get("href") or ""
                      if not href:
                          continue
                      full = urljoin(BASE_URL, href)
                      m = re.search(r"[?&]id=([^&]+)", full) or re.search(r"/profile/([^/?]+)", full)
                      pid = m.group(1) if m else full
                      if pid in seen_ids:
                          continue
                      seen_ids.add(pid)
                      profile_urls.append(full)
                      new += 1
                      if new <= 5 or new % 10 == 0:
                          log(f" + profile URL [{len(profile_urls)}]: {full}")
                  log(f" Added {new} new URLs this page → total unique: {len(profile_urls)}")
                  if new == 0:
                      empty_pages_streak += 1
                      if empty_pages_streak >= MAX_EMPTY_STREAK:
                          break
                  else:
                      empty_pages_streak = 0
                  next_link = soup.select_one(
                      "div.paginator a.next, a.next.pill, a[aria-label='Next page'], a[title='Next page']"
                  )
                  has_next = bool(next_link and next_link.get("href"))
                  if not has_next:
                      page_links = soup.select("div.paginator a[href*='page='], a.pill[href*='page=']")
                      if page_links:
                          try:
                              nums = [
                                  int(re.search(r"page=(\d+)", a.get("href", "")).group(1))
                                  for a in page_links if re.search(r"page=(\d+)", a.get("href", ""))
                              ]
                              max_p = max(nums) if nums else page
                              if page < max_p:
                                  has_next = True
                          except Exception as e:
                              log(f" page-num parse error: {e}")
                  if not has_next:
                      log(" No more list pages.")
                      break
                  page += 1
                  time.sleep(0.3)
              log("=" * 60)
              log(f"PHASE 1 DONE → {len(profile_urls)} profile URLs collected")
              log("=" * 60)
              browser.close()

          extraction_stats = {"name": 0, "about": 0, "image": 0, "total": 0}
          stats_lock = threading.Lock()
          debug_html_saved = threading.Event()

          # Generic boilerplate titles that show up on every profile when the
          # page hasn't actually rendered per-profile content yet (SPA shell /
          # default meta title) — never accept these as a real full_name.
          GENERIC_TITLES = {
              "enjoy your favorite chef profile",
          }

          def extract_profile(soup, purl, html):
              image_url = ""
              full_name = ""

              # --- image + name from <div class="card-image"><img src=... alt="Chef Sultan"> ---
              img_el = soup.select_one("div.card-image img")
              if img_el:
                  src = img_el.get("src") or img_el.get("data-src") or img_el.get("data-lazy-src") or ""
                  if src and not src.startswith("data:"):
                      image_url = urljoin(BASE_URL, src)
                  alt = (img_el.get("alt") or "").strip()
                  if alt:
                      full_name = alt

              # --- fallback name: injected via CSS `#Chef-card .card-title::before { content: "..." }` ---
              # Minifiers often drop the space / use a single colon (":before" not "::before"),
              # so the regex must tolerate both, plus no-space variants.
              if not full_name:
                  m = re.search(
                      r"\.card-title\s*:{1,2}\s*before\s*\{[^}]*content\s*:\s*[\"']([^\"']+)[\"']",
                      html, re.I,
                  )
                  if m:
                      raw = m.group(1).strip()
                      # Typical content string looks like "Ashley's as chef Profile" —
                      # pull just the name portion before the possessive "'s".
                      name_m = re.match(r"^(.+?)'s\b", raw)
                      full_name = name_m.group(1).strip() if name_m else raw

              # --- last-resort: <title>, but reject generic/boilerplate titles ---
              if not full_name and soup.title:
                  t = (soup.title.string or "").strip()
                  if t and t.lower() not in GENERIC_TITLES:
                      full_name = t.split("|")[0].split("-")[0].strip()

              # --- about from <div class="desc"><div class="subtitle">About:</div><p>...</p></div> ---
              about = ""
              desc_p = soup.select_one("div.desc p")
              if desc_p:
                  about = desc_p.get_text(" ", strip=True)
              else:
                  desc_container = soup.select_one("div.desc")
                  if desc_container:
                      about = desc_container.get_text(" ", strip=True)
              about = re.sub(r"^About:\s*", "", about, flags=re.I).strip()

              # last-resort: hunt for "About: ..." anywhere in the rendered text
              if not about:
                  text = soup.get_text(" ", strip=True)
                  m2 = re.search(r"About:\s*(.+?)(?:$)", text)
                  if m2:
                      about = m2.group(1).strip()[:800]

              return full_name, about, image_url

          def worker_scrape(chunk, worker_id):
              local_results = []
              local_dups = 0
              if not chunk:
                  return local_results, local_dups
              with sync_playwright() as p:
                  browser, context, page_obj = new_stealth_page(p)
                  log(f"[W{worker_id}] browser ready, {len(chunk)} profiles assigned")
                  since_last_checkpoint = 0
                  for i, purl in enumerate(chunk, 1):
                      log(f"[W{worker_id}] {i}/{len(chunk)} → {purl}")
                      html = ""
                      load_error = None
                      # Up to 2 tries: the site is client-rendered, so a bare
                      # domcontentloaded snapshot can catch an empty shell.
                      # Wait for one of the real content elements to actually
                      # appear before reading page.content(); reload once and
                      # retry if it never shows up.
                      for load_attempt in range(1, 3):
                          try:
                              t0 = time.time()
                              resp = page_obj.goto(purl, wait_until="domcontentloaded", timeout=45000)
                              log(f"[W{worker_id}]  goto attempt {load_attempt} done in {time.time()-t0:.1f}s | status={resp.status if resp else 'N/A'}")
                              try:
                                  page_obj.wait_for_load_state("networkidle", timeout=12000)
                              except PlaywrightTimeout:
                                  log(f"[W{worker_id}]  (networkidle wait timed out, continuing anyway)")
                              page_obj.evaluate("window.scrollTo(0, 400)")
                              try:
                                  page_obj.wait_for_selector(
                                      "div.card-image, div.desc, #Chef-card",
                                      timeout=15000,
                                  )
                              except PlaywrightTimeout:
                                  log(f"[W{worker_id}]  ⚠ content selectors not found within 15s (attempt {load_attempt})")
                                  if load_attempt == 1:
                                      log(f"[W{worker_id}]  reloading and retrying once ...")
                                      continue
                              page_obj.wait_for_timeout(PROFILE_WAIT_MS)
                              html = page_obj.content()
                              load_error = None
                              break
                          except Exception as e:
                              load_error = e
                              log(f"[W{worker_id}]  ✗ load attempt {load_attempt} failed: {type(e).__name__}: {e}")
                              if load_attempt < 2:
                                  time.sleep(2)
                      if load_error is not None or not html:
                          log(f"[W{worker_id}]  ✗ ERROR loading profile after retries: {load_error}")
                          local_results.append({
                              "image_url": "", "full_name": "", "about": f"ERROR: {load_error}", "profile_url": purl,
                          })
                          continue
                      if not debug_html_saved.is_set():
                          try:
                              DATA_DIR.mkdir(parents=True, exist_ok=True)
                              with open(DEBUG_HTML_FILE, "w", encoding="utf-8") as f:
                                  f.write(html)
                              debug_html_saved.set()
                          except Exception:
                              pass
                      soup = BeautifulSoup(html, "lxml")
                      full_name, about, image_url = extract_profile(soup, purl, html)
                      with stats_lock:
                          extraction_stats["total"] += 1
                          if full_name:
                              extraction_stats["name"] += 1
                          if about:
                              extraction_stats["about"] += 1
                          if image_url:
                              extraction_stats["image"] += 1
                      if image_url:
                          with known_urls_lock:
                              if image_url in known_image_urls:
                                  local_dups += 1
                                  continue
                              known_image_urls.add(image_url)
                      local_results.append({
                          "image_url": image_url, "full_name": full_name, "about": about, "profile_url": purl,
                      })
                      since_last_checkpoint += 1
                      log(f"[W{worker_id}]  ✓ saved: name={full_name[:40]!r} | img={bool(image_url)} | about_len={len(about)}")
                      if since_last_checkpoint >= CHECKPOINT_EVERY:
                          save_checkpoint(local_results[-since_last_checkpoint:], reason=f"W{worker_id} +{since_last_checkpoint}")
                          since_last_checkpoint = 0
                  if since_last_checkpoint > 0:
                      save_checkpoint(local_results[-since_last_checkpoint:], reason=f"W{worker_id} final +{since_last_checkpoint}")
                  browser.close()
              return local_results, local_dups

          def chunk_list(lst, n):
              if n <= 0:
                  return [lst]
              k, m = divmod(len(lst), n)
              return [lst[i*k+min(i, m):(i+1)*k+min(i+1, m)] for i in range(n)]

          results = []
          if not profile_urls:
              log("No profile URLs found. Will still save / upload existing state.")
          else:
              workers_needed = min(CONCURRENCY, len(profile_urls))
              log("=" * 60)
              log(f"PHASE 2: Visit profile pages in parallel ({workers_needed} workers)")
              log("=" * 60)
              chunks = chunk_list(profile_urls, workers_needed)
              total_dups = 0
              try:
                  with ThreadPoolExecutor(max_workers=workers_needed) as executor:
                      futures = {
                          executor.submit(worker_scrape, chunk, idx + 1): idx
                          for idx, chunk in enumerate(chunks)
                      }
                      for fut in as_completed(futures):
                          chunk_results, chunk_dups = fut.result()
                          results.extend(chunk_results)
                          total_dups += chunk_dups
              except Exception as e:
                  log(f" ✗ Phase 2 crashed: {type(e).__name__}: {e}")
              log(f"PHASE 2 DONE → {len(results)} new profiles, {total_dups} duplicates skipped")
              if extraction_stats["total"]:
                  log(f" Extraction hit-rate → name: {extraction_stats['name']}/{extraction_stats['total']}, "
                      f"about: {extraction_stats['about']}/{extraction_stats['total']}, "
                      f"image: {extraction_stats['image']}/{extraction_stats['total']}")

          DATA_DIR.mkdir(parents=True, exist_ok=True)
          with open(IMAGE_URLS_FILE, "w", encoding="utf-8") as f:
              for u in sorted(known_image_urls):
                  f.write(u + "\n")
          log(f"Wrote {len(known_image_urls)} image URLs → {IMAGE_URLS_FILE}")

          if accumulated_new:
              final_df = pd.concat([existing_df, pd.DataFrame(accumulated_new, columns=["image_url", "full_name", "about", "profile_url"])], ignore_index=True)
              final_df = final_df.drop_duplicates(subset=["profile_url"], keep="first")
              final_df.to_excel(XLSX_FILE, sheet_name=SHEET_NAME, index=False, engine="openpyxl")
              shutil.copy(XLSX_FILE, OUT_XLSX)
              log(f"Final state → sheet '{SHEET_NAME}' has {len(final_df)} total rows")
          elif XLSX_FILE.exists():
              shutil.copy(XLSX_FILE, OUT_XLSX)
              log(f"No new rows this run → sheet '{SHEET_NAME}' unchanged at {len(existing_df)} rows")
          else:
              log("No xlsx file exists — no profiles were ever successfully scraped this run.")
          log("=" * 60)
          log(f"SCRAPE FINISHED → {len(results)} new profiles")
          log("=" * 60)
          PYEOF

      - name: Upload results to Mega.nz (single final upload)
        if: steps.lock.outputs.acquired == 'true'
        run: |
          echo "=== Uploading to mega:foodies-scrape/ ==="
          rclone mkdir mega:foodies-scrape || true
          rclone copy data/image_urls.txt mega:foodies-scrape/ --progress
          rclone copy data/foodies_profiles.xlsx mega:foodies-scrape/ --progress
          echo "=== Upload done ==="
          rclone ls mega:foodies-scrape/

      - name: Upload XLSX artifact (GitHub)
        if: steps.lock.outputs.acquired == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: foodies-profiles-instance-${{ matrix.instance }}
          path: |
            foodies_profiles.xlsx
            data/image_urls.txt
            data/debug_first_profile.html
          retention-days: 30
          if-no-files-found: warn

      # Always release the lock if we're the one holding it, so a future
      # run isn't blocked by this instance's claim.
      - name: Release lock
        if: always() && steps.lock.outputs.acquired == 'true'
        run: |
          CURRENT=$(rclone cat mega:foodies-scrape/.run-lock.txt 2>/dev/null || echo "")
          MY_ID=$(cat lock/my_lock_id.txt 2>/dev/null || echo "")
          if [ -n "$MY_ID" ] && [ "$CURRENT" == "$MY_ID" ]; then
            rclone deletefile mega:foodies-scrape/.run-lock.txt
            echo "Lock released"
          else
            echo "Lock not owned by this instance anymore — leaving as is"
          fi

      - name: Instance summary
        if: always()
        run: |
          echo "### Instance ${{ matrix.instance }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.lock.outputs.acquired }}" == "true" ]; then
            echo "- ✅ Reachable + won the lock → this instance ran the scrape" >> $GITHUB_STEP_SUMMARY
            if [ -f foodies_profiles.xlsx ]; then
              python -c "
          import pandas as pd
          from openpyxl import load_workbook
          wb = load_workbook('foodies_profiles.xlsx')
          print(f'- **Sheets**: {wb.sheetnames}')
          sheet = '${{ github.event.inputs.sheet_name }}'
          if sheet in wb.sheetnames:
              df = pd.read_excel('foodies_profiles.xlsx', sheet_name=sheet)
              print(f'- **Rows in sheet \"{sheet}\":** {len(df)}')
          " >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ steps.probe.outputs.accessible }}" == "true" ]; then
            echo "- 🌐 Reachable, but lost the race to another instance → skipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 🚫 Site NOT reachable from this runner's IP (${{ steps.probe.outputs.reason }}) → skipped" >> $GITHUB_STEP_SUMMARY
          fi
